<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>لبيبة | LABEEBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* التخطيط: عمود واحد بعرض مريح، شريط علوي ثابت، بطاقات للصفوف والدروس، ومشغّل بخط زمني مقسّم إلى أجزاء */
:root{
  /* هوية لبيبة: بنفسجي ذكي، كحلي معرفي، نعناعي هادئ، عاجي دافئ */
  --brand-violet:#7864A8; --brand-navy:#263A55; --brand-mint:#A8D8D0; --brand-ivory:#F5F0E9;
  --bg:#F5F0E9; --surface:#FFFDF9; --soft:#ECE6F2; --ink:#263A55; --muted:#5D6A80; --line:#E2DACF;
  --accent:#7864A8; --accent-2:#62508F; --on-accent:#FFFFFF;
  --sci:#5B4890; --sci-soft:#ECE6F5; --bio:#2C6E63; --bio-soft:#DDF0EC;
  --bad:#B4432A; --bad-soft:#F8E4DD; --good:#2C6E63; --good-soft:#DDF0EC;
  --note-bg:#FFF3D1; --note-ink:#5E4600;
  --t-gold:#A9770E; --t-silver:#5E6B78; --t-bronze:#A0602F;
  --lab:#263A55; --lab-soft:#D9EEEA;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:12px;
  /* الحركة: منحنيات قوية (مبادئ Emil Kowalski، MIT) */
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131A26; --surface:#1B2434; --soft:#252F45; --ink:#EDEAF4; --muted:#A3ACC0; --line:#2E3A50;
  --accent:#A797D6; --accent-2:#BBAFE2; --on-accent:#1B1530;
  --sci:#BBAFE2; --sci-soft:#2C2748; --bio:#A8D8D0; --bio-soft:#1D3A38; --bad:#F08B6C; --bad-soft:#3A1F18; --good:#A8D8D0; --good-soft:#1D3A38;
  --note-bg:#3A3112; --note-ink:#F2DC97; --t-gold:#F2C94C; --t-silver:#C9D2DB; --t-bronze:#E9A56E; --lab:#A8D8D0; --lab-soft:#1D3A38; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131A26; --surface:#1B2434; --soft:#252F45; --ink:#EDEAF4; --muted:#A3ACC0; --line:#2E3A50;
  --accent:#A797D6; --accent-2:#BBAFE2; --on-accent:#1B1530;
  --sci:#BBAFE2; --sci-soft:#2C2748; --bio:#A8D8D0; --bio-soft:#1D3A38; --bad:#F08B6C; --bad-soft:#3A1F18; --good:#A8D8D0; --good-soft:#1D3A38;
  --note-bg:#3A3112; --note-ink:#F2DC97; --t-gold:#F2C94C; --t-silver:#C9D2DB; --t-bronze:#E9A56E; --lab:#A8D8D0; --lab-soft:#1D3A38; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:700}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* الشريط العلوي */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-inline-end:auto}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.1rem;font-weight:700;display:block;line-height:1.2}
.brand .latin{font-family:"Readex Pro",sans-serif;font-weight:500;font-size:.72em;letter-spacing:.14em;color:var(--accent);margin-inline-start:4px}
.brand small{color:var(--muted);font-size:.8rem;letter-spacing:.02em}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav a,nav button{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;background:none;border:0;cursor:pointer;font-size:.95rem}
nav a:hover,nav button:hover{color:var(--ink);background:var(--soft)}
nav a.on{color:var(--accent);background:var(--bio-soft)}

.demo{background:var(--note-bg);color:var(--note-ink);font-size:.9rem}
.demo .wrap{padding-block:8px}
main{padding-block:28px 64px;display:grid;gap:28px}

/* عناصر عامة */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:8px;border:1px solid transparent;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:.88rem;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.8rem;font-weight:600}
.chip.sci{background:var(--sci-soft);color:var(--sci)}
.chip.bio{background:var(--bio-soft);color:var(--bio)}
.chip.draft{background:var(--soft);color:var(--muted)}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:600}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);display:grid;gap:12px;justify-items:center}
.loading{color:var(--muted);padding:40px 0;text-align:center}

/* الحقول */
label.f{display:grid;gap:4px;font-size:.9rem;font-weight:500;min-width:0}
input[type=text],input:not([type]),input[type=number],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* الصفحة الرئيسية */
.hero .tagline{font-family:var(--f-display);font-weight:500;color:var(--accent);font-size:.95rem}
.hero .tagline bdi{letter-spacing:.04em}
.hero{display:grid;gap:8px;max-width:640px}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.grade{display:grid;gap:10px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.grade:hover{border-color:var(--accent)}
.grade .stage{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.grade h2{font-size:1.2rem}
.grade .counts{display:flex;gap:6px;flex-wrap:wrap}

/* صفحة الصف */
.crumbs{font-size:.9rem;color:var(--muted)}
.crumbs a{color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.unit{display:grid;gap:10px}
.unit h2{font-size:1.05rem;color:var(--muted);font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lesson{display:grid;gap:8px;align-content:start;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.lesson:hover{border-color:var(--accent)}
.lesson h3{font-size:1.05rem}
.lesson .meta{font-size:.85rem;color:var(--muted)}

/* المشغّل */
.lesson-head{display:grid;gap:6px}
.player{display:grid;gap:12px}
.video{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:var(--r);overflow:hidden}
.video > div,.video iframe{position:absolute;inset:0;width:100%;height:100%}
.shield{position:absolute;inset:0;z-index:2;cursor:pointer}
.shield .big{position:absolute;inset:0;margin:auto;width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.shield .big svg{width:30px;height:30px;fill:#fff;transform:scaleX(-1)}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.ctl svg{width:18px;height:18px;fill:var(--ink)}
.ctl.main{background:var(--accent);border-color:var(--accent)}
.ctl.main svg{fill:var(--on-accent)}
.track{position:relative;flex:1 1 200px;height:10px;background:var(--soft);border-radius:999px;overflow:hidden;min-width:120px}
.track .fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);width:0}
.track .mark{position:absolute;inset-block:0;width:3px;background:var(--surface);transform:translateX(50%)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;direction:ltr}
.speed{width:auto;padding:6px 10px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.segs span{font-size:.82rem;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.segs span.done{background:var(--good-soft);color:var(--good)}
.segs span.now{background:var(--ink);color:var(--bg)}

.quiz{display:grid;gap:16px;border:2px solid var(--accent)}
.quiz .qq{display:grid;gap:8px}
.quiz .qq p{font-weight:600}
.choice{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.choice:has(input:checked){border-color:var(--accent);background:var(--bio-soft)}
.choice input{accent-color:var(--accent);flex:none}
.qq.wrong .choice:has(input:checked){border-color:var(--bad);background:var(--bad-soft)}
.qq.right .choice:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.verdict{padding:12px 14px;border-radius:8px;font-weight:600}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}

.start{max-width:520px}
.award{text-align:center;display:grid;gap:8px;justify-items:center;padding:32px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.award svg.medal{width:min(220px,60vw);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.award .tier{font-family:var(--f-display);font-size:clamp(1.4rem,4.5vw,1.9rem);font-weight:700}
.award .who{font-weight:600;font-size:1.1rem}
.award .score{font-variant-numeric:tabular-nums;color:var(--muted)}
.award .next{font-size:.9rem;color:var(--muted);max-width:44ch}
@keyframes pop{0%{transform:scale(.6) rotate(-10deg);opacity:0}70%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.award svg.medal{animation:pop .7s cubic-bezier(.2,.8,.3,1.2) both}
@media (prefers-reduced-motion:reduce){.award svg.medal{animation:fade 300ms ease both}}

/* لوحة المعلمة */
.dash-head{display:flex;gap:12px;flex-wrap:wrap;align-items:end;justify-content:space-between}
.gradelist{display:grid;gap:8px}
.gradeitem{display:grid;grid-template-columns:1fr 90px auto auto;gap:8px;align-items:center}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.03em;background:var(--soft)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
td .row{flex-wrap:nowrap}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stats div{display:grid}
.stats b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}

/* المحرر */
.steps{display:grid;gap:18px}
.step h2{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.step h2 .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:.95rem;flex:none}
.speedbox{display:flex;gap:8px;flex-wrap:wrap}
.speedbox label{display:flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.speedbox input{accent-color:var(--accent)}
.seg{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;background:var(--bg)}
.seg-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg-head h3{margin-inline-end:auto}
.seg-head .end{display:flex;gap:6px;align-items:center;font-size:.9rem}
.seg-head .end input.bad{border-color:var(--bad);background:var(--bad-soft)}
.seg-head .end input{width:96px;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
.q-head .move{width:auto;padding:4px 8px;font-size:.82rem;font-weight:500}
.q-head{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);font-weight:600}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:8px;align-items:center}
.opt input[type=radio]{accent-color:var(--good);width:20px;height:20px;flex:none}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.2rem;padding:0 6px}
.x:hover{color:var(--bad)}
details.ai{border:1px dashed var(--accent);border-radius:8px;background:var(--surface)}
details.ai summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--accent)}
details.ai .ai-body{display:grid;gap:10px;padding:0 14px 14px;font-size:.92rem}
#bank{display:grid;gap:10px}
#bank:empty{display:none}
.bank-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.bq{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.bq.on{border-color:var(--accent)}
.bq input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin-top:3px}
.bq-body{display:grid;gap:6px}
.bq-body textarea{font-weight:600}
.bq .opt input:not([type=radio]){padding:6px 10px;font-size:.9rem}
.bq ul{margin:4px 0 0;padding-inline-start:18px;font-size:.88rem;color:var(--muted)}
.bq li.ok{color:var(--good);font-weight:600}
.bq-time{font-size:.8rem;font-variant-numeric:tabular-nums}
.bq-side{display:flex;gap:4px;align-items:center}
.bq-side select{width:auto;padding:6px 8px;font-size:.88rem}
@media (max-width:560px){.bq{grid-template-columns:auto minmax(0,1fr)}.bq-side{grid-column:2}}
.chip.lab{background:var(--lab-soft);color:var(--lab)}
.chip.ilesson{background:var(--sci-soft);color:var(--accent)}
.labcard.ilcard{border-color:var(--accent);border-style:solid}
.labcard{border-style:dashed;border-color:var(--accent)}
.lab-frame{display:block;width:100%;height:min(80vh,860px);border:1px solid var(--line);border-radius:var(--r);background:#fff}
.ed-side .lab-frame{height:min(60vh,620px)}
@media (max-width:560px){.lab-frame{height:86vh}}
.lab-wrap:fullscreen{background:var(--bg);padding:8px}
.lab-wrap:fullscreen .lab-frame{height:calc(100vh - 16px)}
.lab-empty{display:grid;place-items:center;text-align:center;height:min(60vh,520px);border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);padding:20px}
.progress{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
.labdone{background:var(--good-soft);color:var(--good);border-radius:var(--r);padding:14px 18px;font-weight:600}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:4px 0;justify-self:start}
.errors{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:12px 16px}
.errors ul{margin:6px 0 0;padding-inline-start:20px}
/* محرر الدرس: عمودان على الشاشات العريضة (البيانات والأجزاء | المقطع والنشر) */
main.wide{max-width:1360px}
.ed-grid{display:flex;flex-direction:column;gap:18px}
.ed-main,.ed-side{display:contents}
.s1{order:1}.s2{order:2}.s3{order:3}.s4{order:4}.s-err{order:5}
.s5{order:6;position:sticky;bottom:0;z-index:5;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.s5 h2{display:none}
@media (min-width:980px){
  .ed-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  .ed-main,.ed-side{display:grid;gap:18px;min-width:0}
  .ed-side{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));max-height:calc(100vh - 100px);overflow:auto}
  .s5{position:static;box-shadow:none;padding-bottom:20px}
  .s5 h2{display:flex}
}
.sticky-save{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:50;font-weight:500;max-width:calc(100% - 32px)}

@media (max-width:560px){
  .gradeitem{grid-template-columns:1fr 70px;}
  .gradeitem .btn{grid-row:2}
}

@media print{
  .top,.demo,.noprint,nav{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
}

/* ===== الحركة =====
   ضغطة الأزرار، دخول اللوحات، الرسائل، التغذية الراجعة. transform وopacity فقط، وأقل من 300ms. */
.btn,.ctl,.filters button,.linkbtn,.x{transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
.btn:active:not(:disabled),.ctl:active,.filters button:active{transform:scale(.97)}
.choice{transition:background-color 150ms ease,border-color 150ms ease}
.choice:active{transform:scale(.99)}
.grade,.lesson{transition:border-color 150ms ease,transform 200ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){.grade:hover,.lesson:hover{transform:translateY(-2px)}}
@keyframes enter{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.quiz,.verdict,.award,.errors,.labdone,.empty{animation:enter 240ms var(--ease-out) both}
.bank-fresh .bq{animation:enter 240ms var(--ease-out) both}
.bank-fresh .bq:nth-child(3){animation-delay:40ms}.bank-fresh .bq:nth-child(4){animation-delay:80ms}.bank-fresh .bq:nth-child(5){animation-delay:120ms}.bank-fresh .bq:nth-child(n+6){animation-delay:160ms}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qq.wrong .choice:has(input:checked){animation:nudge 240ms var(--ease-in-out)}

const num = x => Number(x).toLocaleString("ar-SA");
// صيغ العدد بالعربية: ١ درس واحد، ٢ درسان، ٣–١٠ دروس، ١١+ درساً
const plural = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : (n % 100 >= 3 && n % 100 <= 10) ? num(n) + " " + few : num(n) + " " + many;
const nLessons = n => plural(n, "درس واحد", "درسان", "دروس", "درساً");

const nLabs = n => plural(n, "مختبر واحد", "مختبران", "مختبرات", "مختبراً");
const nQs = n => plural(n, "سؤال واحد", "سؤالان", "أسئلة", "سؤالاً");
const pct = x => num(Math.round(x)) + "٪";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtTime = s => { if (s == null || isNaN(s)) return ""; s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const parseTime = str => {
  // يقبل 2:35 و ٢:٣٥ و 2.35 و ٢،٣٥ و 2-35 و 2 35 و 155 (ثوانٍ) و 1:02:35
  str = String(str || "")
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[\u200e\u200f\u061c]/g, "")
    .trim();
  if (!str) return null;
  const p = str.split(/[^0-9]+/).filter(Boolean).map(Number);
  if (!p.length || p.length > 3 || /[^0-9:.,٫،\-\s]/.test(str)) return NaN;
  if (p.length > 1 && p.slice(1).some(x => x >= 60)) return NaN;
  return p.reduce((a, b) => a * 60 + b, 0);
};
const byOrder = (a, b) => (Number(a.order) || 0) - (Number(b.order) || 0) || String(a.name || a.title || "").localeCompare(String(b.name || b.title || ""), "ar");
const subjClass = s => s === "أحياء" ? "bio" : "sci";
const ls = {

/* ======================= التخزين ======================= */
const LocalStore = {
  _all(k) { return ls.get(k, []); },
  _save(k, v) { ls.set(k, v); },
  _upsert(k, obj) {
    const a = this._all(k); if (!obj.id) obj.id = uid();
    const i = a.findIndex(x => x.id === obj.id); i < 0 ? a.push(obj) : (a[i] = obj);
    this._save(k, a); return obj.id;
  },
  async grades() { return GRADES; },
  async lessons(all) { const a = this._all("lessons"); return all ? a : a.filter(l => l.published); },
  async getLesson(id) { return this._all("lessons").find(l => l.id === id) || null; },
  async saveLesson(l) { return this._upsert("lessons", { ...l }); },
  async deleteLesson(id) { this._save("lessons", this._all("lessons").filter(x => x.id !== id)); },
  async addResult(r) { this._upsert("results", { ...r }); },
  async results() { return this._all("results"); },
  async deleteResult(id) { this._save("results", this._all("results").filter(x => x.id !== id)); },
  async labs(all) { const a = this._all("labs"); return all ? a : a.filter(l => l.published); },
  async getLab(id) { return this._all("labs").find(l => l.id === id) || null; },
  async saveLab(l) { return this._upsert("labs", { ...l }); },
  async deleteLab(id) { this._save("labs", this._all("labs").filter(x => x.id !== id)); }
};
/* Supabase: جدولا lessons و results (انظر ملف supabase.sql) */
let sb = null;
const ok = ({ data, error }) => { if (error) throw error; return data; };
const isUuid = v => /^[0-9a-f-]{36}$/i.test(String(v || ""));
const rowToLesson = r => ({ ...(r.data || {}), id: r.id, gradeId: r.grade_id || "", published: r.published, order: r.sort });
const rowToResult = r => ({
  id: r.id, lessonId: r.lesson_id || r.lab_id, labId: r.lab_id || "", lessonTitle: r.lesson_title, subject: r.subject, gradeId: r.grade_id || "", gradeName: r.grade_name,
  studentName: r.student_name, studentClass: r.student_class, correct: r.correct, total: r.total, score: r.score,
  attempts: r.attempts, minutes: r.minutes, completedAt: r.completed_at
});
const SupaStore = {
  init() { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); },
  async grades() { return GRADES; },
  async lessons(all) {
    let q = sb.from("lessons").select("*");
    if (!all) q = q.eq("published", true);
    return ok(await q).map(rowToLesson);
  },
  async getLesson(id) {
    if (!isUuid(id)) return null;
    const { data, error } = await sb.from("lessons").select("*").eq("id", id).maybeSingle();
    return error || !data ? null : rowToLesson(data);
  },
  async saveLesson(l) {
    const { id, gradeId, published, order, ...data } = l;
    const row = { grade_id: gradeId || null, published: !!published, sort: Number(order) || 0, data, updated_at: new Date().toISOString() };
    if (id) { ok(await sb.from("lessons").update(row).eq("id", id)); return id; }
    return ok(await sb.from("lessons").insert(row).select("id").single()).id;
  },
  async deleteLesson(id) { ok(await sb.from("lessons").delete().eq("id", id)); },
  async addResult(r) {
    ok(await sb.from("results").insert({
      ...(r.labId ? { lab_id: r.labId, lesson_id: null } : { lesson_id: r.lessonId }), lesson_title: r.lessonTitle, subject: r.subject, grade_id: r.gradeId || null, grade_name: r.gradeName,
      student_name: r.studentName, student_class: r.studentClass, correct: r.correct, total: r.total, score: r.score,
      attempts: r.attempts, minutes: r.minutes, completed_at: r.completedAt
    }));
  },
  async results() { return ok(await sb.from("results").select("*").order("completed_at", { ascending: false }).limit(5000)).map(rowToResult); },
  async deleteResult(id) { ok(await sb.from("results").delete().eq("id", id)); },
  async labs(all) {
    let q = sb.from("labs").select("*");
    if (!all) q = q.eq("published", true);
    return ok(await q).map(rowToLesson);
  },
  async getLab(id) {
    if (!isUuid(id)) return null;
    const { data, error } = await sb.from("labs").select("*").eq("id", id).maybeSingle();
    return error || !data ? null : rowToLesson(data);
  },
  async saveLab(l) {
    const { id, gradeId, published, order, ...data } = l;
    const row = { grade_id: gradeId || null, published: !!published, sort: Number(order) || 0, data, updated_at: new Date().toISOString() };
    if (id) { ok(await sb.from("labs").update(row).eq("id", id)); return id; }
    return ok(await sb.from("labs").insert(row).select("id").single()).id;
  },
  async deleteLab(id) { ok(await sb.from("labs").delete().eq("id", id)); }
};
let Store = LocalStore;
const safeLabs = async all => { try { return await Store.labs(all); } catch (e) { console.warn("labs:", e); return []; } };
const state = { user: null, isTeacher: DEMO, authReady: DEMO };

/* ======================= التنقل ======================= */
function hashParts() {
  const h = decodeURIComponent(location.hash.slice(1));
  const i = h.indexOf("=");
  return i < 0 ? { k: h || "home", v: "" } : { k: h.slice(0, i), v: h.slice(i + 1) };
}
function renderNav() {
  const { k } = hashParts();
  const items = [["#", "الصفوف", ["home", "grade", "lesson", "lab", "ilesson"].includes(k)]];
  if (state.isTeacher) items.push(["#teacher", "الصف المقلوب", ["teacher", "edit"].includes(k)], ["#ilessons", "الدروس التفاعلية", ["ilessons", "iledit"].includes(k)], ["#labs", "المختبرات", ["labs", "labedit"].includes(k)], ["#results", "النتائج", k === "results"]);
  let html = items.map(([h, t, on]) => `<a href="${h}" class="${on ? "on" : ""}">${t}</a>`).join("");
  if (!DEMO) html += state.user ? `<button id="signout" type="button">خروج</button>` : `<a href="#teacher" class="${k === "teacher" ? "on" : ""}">دخول المعلمة</a>`;
  $("#nav").innerHTML = html;
  $("#signout")?.addEventListener("click", async () => { await sb.auth.signOut(); location.hash = ""; });
}
async function route() {
  stopPlayer(); stopEditPlayer(); stopLab();
  app.classList.remove("wide");
  renderNav();
  const { k, v } = hashParts();
  window.scrollTo(0, 0);
  try {
    if (k === "grade") return await viewGrade(v);
    if (k === "lesson") return await viewLesson(v);
    if (k === "lab") return await viewLab(v);
    if (k === "ilesson") return await viewILesson(v);
    if (["teacher", "edit", "results", "labs", "labedit", "ilessons", "iledit"].includes(k)) {
      if (!state.authReady) { app.innerHTML = `<p class="loading">جارٍ التحقق من الدخول…</p>`; return; }
      if (!state.isTeacher) return viewLogin();
      if (k === "teacher") return await viewTeacher();
      if (k === "edit") return await viewEditor(v);
      if (k === "results") return await viewResults();
      if (k === "labs") return await viewLabs();
      if (k === "labedit") return await viewLabEditor(v);
      if (k === "ilessons") return await viewILessons();
      if (k === "iledit") return await viewILessonEditor(v);
    }
    return await viewHome();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="empty"><h2>تعذّر تحميل البيانات</h2><p>تحقق من الاتصال بالإنترنت ثم حدّث الصفحة. (${esc(e.code || e.message)})</p></div>`;
  }
}
function viewLogin() {
  if (state.user) {
    app.innerHTML = `<div class="empty"><h2>هذا الحساب ليس حساب معلمة</h2><p>الحساب ${esc(state.user.email)} غير مضاف إلى جدول المعلمات في Supabase.</p><button class="btn ghost" id="lo" type="button">خروج</button></div>`;
    $("#lo").addEventListener("click", () => sb.auth.signOut());
    return;
  }
  app.innerHTML = `
    <form class="panel start stack" id="loginf" style="margin-inline:auto;width:100%">
      <div><span class="eyebrow">لوحة المعلمة</span><h1>دخول المعلمة</h1></div>
      <label class="f">البريد الإلكتروني<input id="li-email" type="email" required autocomplete="username" dir="ltr"></label>
      <label class="f">كلمة المرور<input id="li-pass" type="password" required autocomplete="current-password" dir="ltr"></label>
      <div id="li-err"></div>
      <button class="btn" type="submit">دخول</button>
    </form>`;
  $("#loginf").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#loginf button"); btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $("#li-email").value.trim(), password: $("#li-pass").value });
    btn.disabled = false;
    if (error) $("#li-err").innerHTML = `<div class="verdict no">${error.message.includes("Invalid") ? "البريد أو كلمة المرور غير صحيحة." : esc(error.message)}</div>`;

}

/* ======================= الصفحة الرئيسية ======================= */
async function viewHome() {
  app.innerHTML = `<p class="loading">جارٍ التحميل…</p>`;
  const [allGrades, lessons, labs] = await Promise.all([Store.grades(), Store.lessons(false), safeLabs(false)]);
  const grades = allGrades.filter(g => lessons.some(l => l.gradeId === g.id) || labs.some(l => l.gradeId === g.id));
  const head = `<section class="hero"><p class="tagline"><bdi lang="en" dir="ltr">${SITE_TAGLINE_EN}</bdi> · ${SITE_TAGLINE_AR}</p><h1>اختاري صفّك</h1><p class="muted">كل درس مقطع مرئي مقسّم إلى أجزاء، وفي نهاية كل جزء أسئلة قصيرة. أجيبي عنها لتنتقلي إلى الجزء التالي، وتحصلي على شارة إنجاز في النهاية.</p></section>`;
  if (!grades.length) {
    app.innerHTML = head + `<div class="empty"><h2>لا توجد دروس منشورة بعد</h2><p>${state.isTeacher ? "أنشئ أول درس واختر صفّه، وسيظهر الصف هنا للطالبات." : "ستضيف المعلمة الدروس قريباً."}</p>${state.isTeacher ? `<a class="btn" href="#edit=new">+ درس جديد</a>` : ""}</div>`;
    return;
  }
  app.innerHTML = head + `<section class="grades">${grades.map(g => {
    const ls_ = lessons.filter(l => l.gradeId === g.id);
    const counts = SUBJECTS.map(s => [s, ls_.filter(l => l.subject === s).length]).filter(x => x[1]);
    const other = ls_.filter(l => !SUBJECTS.includes(l.subject)).length;
    return `<a class="grade" href="#grade=${encodeURIComponent(g.id)}">
      ${g.stage ? `<span class="stage">${esc(g.stage)}</span>` : ""}
      <h2>${esc(g.name)}</h2>
      <div class="counts">${counts.map(([s, n]) => `<span class="chip ${subjClass(s)}">${esc(s)}: ${nLessons(n)}</span>`).join("")}${other ? `<span class="chip draft">أخرى: ${nLessons(other)}</span>` : ""}${(() => { const mine = labs.filter(l => l.gradeId === g.id), ni = mine.filter(l => l.kind === "interactive").length, nl = mine.length - ni; return (ni ? `<span class="chip ilesson">دروس تفاعلية: ${num(ni)}</span>` : "") + (nl ? `<span class="chip lab">المختبرات: ${nLabs(nl)}</span>` : ""); })()}${!ls_.length && !labs.some(l => l.gradeId === g.id) ? `<span class="muted" style="font-size:.85rem">لا دروس بعد</span>` : ""}</div>
    </a>`;
  }).join("")}</section>`;
}

async function viewGrade(id) {
  app.innerHTML = `<p class="loading">جارٍ التحميل…</p>`;
  const [grades, all, allLabs] = await Promise.all([Store.grades(), Store.lessons(false), safeLabs(false)]);
  const g = grades.find(x => x.id === id);
  const labs = allLabs.filter(l => l.gradeId === id).sort(byOrder);
  if (!g) { app.innerHTML = `<div class="empty"><h2>الصف غير موجود</h2><a class="btn ghost" href="#">العودة إلى الصفوف</a></div>`; return; }
  const lessons = all.filter(l => l.gradeId === id).sort(byOrder);
  const subjects = [...new Set([...lessons, ...labs].map(l => l.subject))];
  let filter = "الكل";
  app.innerHTML = `
    <div class="lesson-head"><div class="crumbs"><a href="#">الصفوف</a> › ${esc(g.name)}</div><h1>${esc(g.name)}</h1></div>
    ${subjects.length > 1 ? `<div class="filters" id="filters">${["الكل", ...subjects].map(s => `<button type="button" data-s="${esc(s)}" class="${s === filter ? "on" : ""}">${esc(s)}</button>`).join("")}</div>` : ""}
    <div id="list" class="stack" style="gap:28px"></div>`;
  const draw = () => {
    const shown = lessons.filter(l => filter === "الكل" || l.subject === filter);
    const shownAll = labs.filter(l => filter === "الكل" || l.subject === filter);
    const shownIL = shownAll.filter(l => l.kind === "interactive");

      </a>`).join("")}</div></section>` : "";
    const labsHtml = shownLabs.length ? `<section class="unit"><h2>المختبرات الافتراضية</h2><div class="lessons">${shownLabs.map(l => `

    const units = [];
    shown.forEach(l => { const u = (l.unit || "").trim() || "دروس الصف"; let e = units.find(x => x[0] === u); if (!e) units.push(e = [u, []]); e[1].push(l); });
    $("#list").innerHTML = ilHtml + labsHtml + units.map(([u, arr]) => `<section class="unit"><h2>${esc(u)}</h2><div class="lessons">${arr.map(l => `
      <a class="lesson" href="#lesson=${encodeURIComponent(l.id)}">

  };

}

let ytPromise;
function loadYT() {
  if (ytPromise) return ytPromise;
  ytPromise = new Promise(res => {
    if (window.YT && YT.Player) return res();
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev && prev(); res(); };
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
  });
  return ytPromise;
}
const IS_LOCAL_FILE = location.protocol === "file:";
const ytOrigin = () => (/^https?:$/.test(location.protocol) ? { origin: location.origin } : {});
const LOCAL_NOTE = `<div class="verdict no" style="margin-top:10px">يوتيوب لا يشغّل المقاطع والصفحة مفتوحة كملف من الجهاز (يظهر الخطأ 153). ارفع المنصة على GitHub Pages أو Netlify وافتحها من رابطها، وسيعمل المقطع.</div>`;

function startPlayer(lesson, grade, student, preview) {
  const segs = lesson.segments || [];
  const speeds = (lesson.speeds && lesson.speeds.length ? lesson.speeds : [1]).slice().sort((a, b) => a - b);
  Object.assign(P, { lesson, grade, student, preview, segs, seg: 0, ends: [], dur: 0, quizOpen: false, done: false, first: {}, attempts: 0, startedAt: Date.now() });
  $("#stage").innerHTML = `
    <div class="player">
      <div class="video"><div id="yt"></div><div class="shield" id="shield"><span class="big">${ICON.play}</span></div></div>
      <div class="controls noprint">
        <button class="ctl main" id="pp" type="button" aria-label="تشغيل">${ICON.play}</button>
        <button class="ctl" id="rw" type="button" aria-label="رجوع ١٠ ثوانٍ" title="رجوع ١٠ ثوانٍ">${ICON.back}</button>
        <div class="track" id="track"><div class="fill" id="fill"></div></div>
        <span class="time" id="time">0:00</span>
        ${speeds.length > 1 ? `<select class="speed" id="spd" aria-label="سرعة التشغيل">${speeds.map(s => `<option value="${s}" ${s === 1 ? "selected" : ""}>×${s}</option>`).join("")}</select>` : ""}
      </div>
      ${IS_LOCAL_FILE ? LOCAL_NOTE : ""}
      <div class="segs" id="segs"></div>
      <div id="quiz"></div>
    </div>`;
  drawSegs();
  loadYT().then(() => {
    P.player = new YT.Player("yt", {
      videoId: lesson.videoId,
      playerVars: { controls: 0, disablekb: 1, rel: 0, modestbranding: 1, playsinline: 1, fs: 0, iv_load_policy: 3, cc_load_policy: 0, ...ytOrigin() },
      events: {
        onReady: () => {
          computeEnds();
          const s0 = speeds.includes(1) ? 1 : speeds[0];
          try { P.player.setPlaybackRate(s0); } catch {}
          clearInterval(P.timer); P.timer = setInterval(tick, 200);
        },
        onStateChange: e => {
          const playing = e.data === YT.PlayerState.PLAYING;
          $("#pp") && ($("#pp").innerHTML = playing ? ICON.pause : ICON.play);
          $("#shield") && ($(".big", $("#shield")).hidden = playing);
          if (playing && !P.dur) computeEnds();
          if (e.data === YT.PlayerState.ENDED && !P.quizOpen && !P.done) openQuiz();
        }
      }
    });
  });
  const toggle = () => {
    if (!P.player || P.quizOpen || P.done) return;
    P.player.getPlayerState() === YT.PlayerState.PLAYING ? P.player.pauseVideo() : P.player.playVideo();
  };
  $("#pp").addEventListener("click", toggle);
  $("#shield").addEventListener("click", toggle);
  $("#rw").addEventListener("click", () => {
    if (!P.player || P.quizOpen) return;
    P.player.seekTo(Math.max(segStart(P.seg), P.player.getCurrentTime() - 10), true);
  });
  $("#spd")?.addEventListener("change", e => { try { P.player.setPlaybackRate(Number(e.target.value)); } catch {} });
}
function computeEnds() {
  P.dur = P.player.getDuration() || 0;
  P.ends = P.segs.map((s, i) => (s.end != null && s.end !== "" ? Number(s.end) : (i === P.segs.length - 1 ? P.dur : null)));
  const tr = $("#track"); if (!tr || !P.dur) return;
  $$(".mark", tr).forEach(m => m.remove());
  P.ends.slice(0, -1).forEach(e => { if (e) tr.insertAdjacentHTML("beforeend", `<span class="mark" style="inset-inline-start:${(e / P.dur) * 100}%"></span>`); });
}
const segStart = i => (i <= 0 ? 0 : P.ends[i - 1] || 0);
function tick() {
  if (!P.player || !P.player.getCurrentTime) return;
  const t = P.player.getCurrentTime() || 0;
  if (P.dur) { $("#fill").style.transform = "scaleX(" + Math.min(1, t / P.dur).toFixed(4) + ")"; $("#time").textContent = fmtTime(t) + " / " + fmtTime(P.dur); }
  if (P.quizOpen || P.done) return;
  const end = P.ends[P.seg];
  const isLast = P.seg === P.segs.length - 1;
  const explicit = P.segs[P.seg] && P.segs[P.seg].end != null && P.segs[P.seg].end !== "";
  if (end && (!isLast || explicit) && t >= end - 0.25) { P.player.pauseVideo(); openQuiz(); }
}
function drawSegs() {
  $("#segs").innerHTML = P.segs.map((s, i) => `<span class="${i < P.seg || P.done ? "done" : i === P.seg ? "now" : ""}">${i < P.seg || P.done ? "✓ " : ""}الجزء ${num(i + 1)}</span>`).join("");
}
function openQuiz() {
  P.quizOpen = true;
  try { P.player.pauseVideo(); } catch {}
  const s = P.segs[P.seg], qs = s.questions || [];
  if (!qs.length) return passSeg();
  const q = $("#quiz");
  q.innerHTML = `
    <form class="panel quiz" id="qf">
      <div><span class="eyebrow">أسئلة الجزء ${num(P.seg + 1)} من ${num(P.segs.length)}</span><h2>أجيبي لتتابعي</h2><p class="muted">المطلوب للاجتياز: ${pct(P.lesson.passPct ?? 100)} فأكثر.</p></div>
      ${qs.map((x, qi) => `<fieldset class="qq" id="qq${qi}" style="border:0;padding:0;margin:0"><p>${num(qi + 1)}. ${esc(x.text)}</p>
        ${x.options.map((o, oi) => `<label class="choice"><input type="radio" name="a${qi}" value="${oi}" id="a${qi}_${oi}">${esc(o)}</label>`).join("")}</fieldset>`).join("")}
      <div id="verdict"></div>
      <div class="row" id="qbtns"><button class="btn" type="submit">تحقّقي من إجاباتي</button></div>
    </form>`;
  q.scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "start" });
  $("#qf").addEventListener("change", () => { $$(".qq").forEach(f => f.classList.remove("wrong", "right")); });
  $("#qf").addEventListener("submit", e => {
    e.preventDefault();
    const picks = qs.map((_, qi) => { const r = $(`input[name="a${qi}"]:checked`); return r ? Number(r.value) : null; });
    if (picks.some(p => p === null)) { $("#verdict").innerHTML = `<div class="verdict no">أجيبي عن جميع الأسئلة أولاً.</div>`; return; }
    let correct = 0;
    picks.forEach((p, qi) => { const ok = p === Number(qs[qi].correct); if (ok) correct++; $("#qq" + qi).classList.add(ok ? "right" : "wrong"); });
    if (P.first[P.seg] == null) P.first[P.seg] = correct;
    P.attempts++;
    const score = (correct / qs.length) * 100;
    if (score >= (P.lesson.passPct ?? 100)) {
      $$("input", $("#qf")).forEach(i => (i.disabled = true));
      const last = P.seg === P.segs.length - 1;
      $("#verdict").innerHTML = `<div class="verdict ok">أحسنتِ! أجبتِ عن ${num(correct)} من ${num(qs.length)} إجابة صحيحة.</div>`;
      $("#qbtns").innerHTML = `<button class="btn" type="button" id="go">${last ? "إنهاء الدرس" : "متابعة إلى الجزء " + num(P.seg + 2)}</button>`;
      $("#go").addEventListener("click", passSeg); $("#go").focus();
    } else {
      $("#verdict").innerHTML = `<div class="verdict no">أجبتِ عن ${num(correct)} من ${num(qs.length)} إجابة صحيحة. الإجابات المظلّلة بالأحمر تحتاج مراجعة.</div>`;
      $("#qbtns").innerHTML = `<button class="btn" type="button" id="rewatch">أعيدي مشاهدة الجزء</button><button class="btn ghost" type="button" id="retry">حاولي مرة أخرى</button>`;
      $("#rewatch").addEventListener("click", () => { $("#quiz").innerHTML = ""; P.quizOpen = false; P.player.seekTo(segStart(P.seg), true); P.player.playVideo(); $(".video").scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "center" }); });
      $("#retry").addEventListener("click", () => { $$(".qq").forEach(f => f.classList.remove("wrong", "right")); $$("input", $("#qf")).forEach(i => (i.checked = false)); $("#verdict").innerHTML = ""; $("#qbtns").innerHTML = `<button class="btn" type="submit">تحقّقي من إجاباتي</button>`; });
    }
  });
}
function passSeg() {
  $("#quiz").innerHTML = "";
  P.seg++;
  if (P.seg >= P.segs.length) return finish();
  drawSegs(); P.quizOpen = false;
  P.player.seekTo(segStart(P.seg), true); P.player.playVideo();
  $(".video").scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "center" });
}
async function finish() {
  P.done = true; P.quizOpen = false; clearInterval(P.timer);
  try { P.player.pauseVideo(); } catch {}
  drawSegs();
  const total = qCount(P.lesson);
  const correct = Object.values(P.first).reduce((a, b) => a + b, 0);
  const score = total ? Math.round((correct / total) * 100) : 100;
  const date = new Date();
  const result = {
    lessonId: P.lesson.id, lessonTitle: P.lesson.title, subject: P.lesson.subject || "",
    gradeId: P.lesson.gradeId || "", gradeName: P.grade ? P.grade.name : "",
    studentName: P.student.name.slice(0, 80), studentClass: P.student.cls.slice(0, 30),
    correct, total, score, attempts: P.attempts,
    minutes: Math.max(1, Math.round((Date.now() - P.startedAt) / 60000)),
    completedAt: date.toISOString()
  };
  let saveNote = "";
  if (!P.preview) {
    try { await Store.addResult(result); saveNote = "وصلت نتيجتك إلى المعلمة."; }
    catch (e) { console.error(e); saveNote = "تعذّر إرسال النتيجة إلى المعلمة. التقطي صورة لشارتك وأرسليها لها."; }
  }
  const tier = badgeTier(score);
  // شارات الطالب في هذا المتصفح (أفضل شارة لكل درس)
  const mine = ls.get("badges", {});
  const prev = mine[P.lesson.id];
  if (!prev || TIERS.findIndex(t => t.key === prev) > TIERS.indexOf(tier)) mine[P.lesson.id] = tier.key;
  ls.set("badges", mine);
  const counts = TIERS.map(t => [t, Object.values(mine).filter(k => k === t.key).length]).filter(x => x[1]);
  const nextT = TIERS[TIERS.indexOf(tier) - 1];
  $("#quiz").innerHTML = `
    <section class="award" id="award">
      <span class="eyebrow">شارة إنجاز · ${esc(P.lesson.subject)}</span>
      ${medalSVG(tier, P.lesson.subject)}
      <div class="tier" style="color:var(--t-${tier.key})">${tier.title}</div>
      <div class="who">${esc(P.student.name)}</div>
      <p>أنجزتِ درس <b>${esc(P.lesson.title)}</b></p>
      <p class="score">${pct(score)} · ${num(correct)} من ${num(total)} إجابات صحيحة من المحاولة الأولى</p>
      ${nextT ? `<p class="next">أعيدي الدرس وأجيبي صحيحاً من المحاولة الأولى بنسبة ${pct(nextT.min)} لتحصلي على ${nextT.title}.</p>` : ""}
      ${counts.length ? `<p class="next">شاراتك حتى الآن: ${counts.map(([t, n]) => `${num(n)} ${t.short}`).join(" · ")}</p>` : ""}
    </section>
    <div class="row noprint" style="margin-top:14px">
      <button class="btn" type="button" id="savebadge">حفظ الشارة كصورة</button>
      ${P.grade ? `<a class="btn ghost" href="#grade=${encodeURIComponent(P.grade.id)}">دروس ${esc(P.grade.name)}</a>` : ""}
      ${saveNote ? `<span class="muted">${saveNote}</span>` : ""}
    </div>`;
  $("#savebadge").addEventListener("click", () => saveBadgePNG(tier, score));
  $("#award").scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "start" });
}

/* ===== شارات الإنجاز ===== */
const TIERS = [
  { key: "gold",   min: 90, title: "شارة العالِمة المتميّزة", short: "ذهبية",  c1: "#F6D365", c2: "#C9941A", rim: "#8A6410", ink: "#A9770E" },
  { key: "silver", min: 70, title: "شارة الباحثة النشِطة",   short: "فضية",   c1: "#EEF2F5", c2: "#9AA6B2", rim: "#5E6B78", ink: "#6B7785" },
  { key: "bronze", min: 0,  title: "شارة المستكشفة",        short: "برونزية", c1: "#F0B985", c2: "#B06A35", rim: "#6E3E1C", ink: "#A0602F" }
];
const badgeTier = score => TIERS.find(t => score >= t.min);
function medalSVG(t, subject) {
  // وردة مسنّنة حولها شريطان، وفي الوسط رمز المادة
  const pts = [];
  for (let i = 0; i < 32; i++) { const r = i % 2 ? 78 : 88, a = (Math.PI * 2 * i) / 32; pts.push((100 + r * Math.sin(a)).toFixed(1) + "," + (100 - r * Math.cos(a)).toFixed(1)); }
  const bio = /أحياء|حياة/.test(subject || "");
  const earth = /أرض|فضاء/.test(subject || "");
  const icon = bio
    ? `<path d="M100 62c-26 8-38 28-34 56 28 2 46-14 50-40 1-6-4-13-16-16z" fill="#fff" opacity=".95"/><path d="M72 116c12-14 24-26 40-40" stroke="${t.rim}" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M118 70c10 14 14 30 10 46-14 2-24-6-26-18" fill="#fff" opacity=".75"/>`
    : earth
    ? `<circle cx="100" cy="100" r="28" fill="#fff" opacity=".95"/><path d="M84 92c6-6 14-2 16 4s10 6 12 0M88 112c6 2 10-4 16-2" stroke="${t.rim}" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="100" cy="100" rx="46" ry="13" fill="none" stroke="#fff" stroke-width="4" transform="rotate(-20 100 100)"/>`
    : `<g fill="none" stroke="#fff" stroke-width="4.5"><ellipse cx="100" cy="100" rx="40" ry="15"/><ellipse cx="100" cy="100" rx="40" ry="15" transform="rotate(60 100 100)"/><ellipse cx="100" cy="100" rx="40" ry="15" transform="rotate(-60 100 100)"/></g><circle cx="100" cy="100" r="8" fill="#fff"/>`;
  const id = "g" + t.key;
  return `<svg class="medal" viewBox="0 0 200 250" role="img" aria-label="${t.title}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t.c1}"/><stop offset="1" stop-color="${t.c2}"/></linearGradient></defs>
    <path d="M62 160 L40 240 L70 226 L86 250 L104 172 Z" fill="${t.rim}"/>
    <path d="M138 160 L160 240 L130 226 L114 250 L96 172 Z" fill="${t.c2}"/>
    <polygon points="${pts.join(" ")}" fill="url(#${id})" stroke="${t.rim}" stroke-width="2"/>
    <circle cx="100" cy="100" r="62" fill="${t.c2}" stroke="${t.c1}" stroke-width="4"/>
    <circle cx="100" cy="100" r="54" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 5"/>
    ${icon}
  </svg>`;
}
async function saveBadgePNG(tier, score) {
  try {
    const W = 720, H = 900, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = tier.c2; ctx.lineWidth = 6; ctx.strokeRect(18, 18, W - 36, H - 36);
    const svg = medalSVG(tier, P.lesson.subject).replace('class="medal"', 'width="400" height="500"');
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); });
    ctx.drawImage(img, (W - 320) / 2, 50, 320, 400);
    try { await document.fonts.ready; } catch {}
    ctx.direction = "rtl"; ctx.textAlign = "center";
    const line = (txt, y, size, color, weight = 700) => { ctx.font = `${weight} ${size}px "Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif`; ctx.fillStyle = color; ctx.fillText(txt, W / 2, y, W - 80); };
    line(tier.title, 520, 46, tier.ink);
    line(P.student.name, 590, 38, "#10261F");
    line("أنجزت درس: " + P.lesson.title, 650, 28, "#10261F", 500);
    line(pct(score) + " من المحاولة الأولى · " + P.lesson.subject, 700, 26, "#55695F", 500);
    line(new Date().toLocaleDateString("ar-SA", { year: "numeric", month: "long", day: "numeric" }) + (P.lesson.school ? " · " + P.lesson.school : ""), 750, 24, "#55695F", 500);
    line(SITE_NAME, 840, 24, tier.c2, 600);
    const a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = "شارة-" + P.lesson.title.replace(/[\\/:*?"<>|]/g, "").slice(0, 40) + ".png";
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { console.error(e); toast("تعذّر حفظ الصورة. التقط صورة للشاشة بدلاً منها."); }
}

/* ======================= الصف المقلوب (دروس المقاطع) ======================= */
async function viewTeacher() {
  app.innerHTML = `<p class="loading">جارٍ التحميل…</p>`;
  const [grades, lessons] = await Promise.all([Store.grades(), Store.lessons(true)]);
  const home = location.origin + location.pathname;
  app.innerHTML = `
    <div class="dash-head">
      <div><span class="eyebrow">الصف المقلوب</span><h1>دروسي</h1></div>
      <div class="row"><button class="btn ghost" type="button" id="copyhome">نسخ رابط المنصة للطالبات</button><a class="btn" href="#edit=new">+ درس جديد</a></div>
    </div>
    <section class="stack" id="lessons-by-grade"></section>`;
  $("#copyhome").addEventListener("click", () => copy(home));

  const groups = [...grades.map(g => [g, lessons.filter(l => l.gradeId === g.id)]), [{ id: "", name: "دروس بلا صف" }, lessons.filter(l => !grades.some(g => g.id === l.gradeId))]].filter(([, arr]) => arr.length);
  if (!groups.length) {
    $("#lessons-by-grade").innerHTML = `<div class="empty"><h2>لا توجد دروس بعد</h2><p>أنشئ أول درس، واختر صفّه ومادته من صفحة الدرس.</p><a class="btn" href="#edit=new">+ درس جديد</a></div>`;
    return;
  }
  $("#lessons-by-grade").innerHTML = groups.map(([g, arr]) => `
    <div class="stack" style="gap:10px">
      <div class="row" style="justify-content:space-between"><h2>${esc(g.name)}</h2>${g.id ? `<a class="btn ghost sm" href="#edit=new&grade=${encodeURIComponent(g.id)}">+ درس لهذا الصف</a>` : ""}</div>
      ${arr.length ? `<div class="table-wrap"><table>
        <thead><tr><th>الدرس</th><th>المادة</th><th>الوحدة</th><th>الأجزاء</th><th>الحالة</th><th></th></tr></thead>
        <tbody>${arr.sort(byOrder).map(l => `<tr data-id="${esc(l.id)}">
          <td><b>${esc(l.title)}</b></td>
          <td><span class="chip ${subjClass(l.subject)}">${esc(l.subject)}</span></td>
          <td>${esc(l.unit || "—")}</td>
          <td class="num">${num((l.segments || []).length)} / ${num(qCount(l))} س</td>
          <td>${l.complete === false ? `<span class="chip draft">مسودة غير مكتملة</span>` : l.published ? `<span class="chip bio">منشور</span>` : `<span class="chip draft">غير منشور</span>`}</td>
          <td><div class="row">
            <a class="btn ghost sm" href="#edit=${encodeURIComponent(l.id)}">تعديل</a>
            <a class="btn ghost sm" href="#iledit=new&lesson=${encodeURIComponent(l.id)}" title="إنشاء درس تفاعلي من هذا الدرس">تفاعلي</a>
            <a class="btn ghost sm" href="#labedit=new&lesson=${encodeURIComponent(l.id)}" title="إنشاء مختبر افتراضي لهذا الدرس">مختبر</a>
            <button class="btn ghost sm" type="button" data-act="link">نسخ الرابط</button>
            <button class="btn ghost sm" type="button" data-act="pub">${l.published ? "إخفاء" : "نشر"}</button>
            <button class="btn danger sm" type="button" data-act="del">حذف</button>
          </div></td></tr>`).join("")}</tbody></table></div>`
      : `<p class="muted">لا دروس في هذا الصف بعد.</p>`}
    </div>`).join("");
  $("#lessons-by-grade").addEventListener("click", async e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = b.closest("tr").dataset.id, l = lessons.find(x => x.id === id);
    if (b.dataset.act === "link") copy(lessonLink(id));
    if (b.dataset.act === "pub" && l.complete === false && !l.published) { toast("الدرس غير مكتمل. افتحه بزر «تعديل» وأكمله ثم احفظه."); return; }
    if (b.dataset.act === "pub") { await Store.saveLesson({ ...l, published: !l.published }); toast(l.published ? "أُخفي الدرس عن الطالبات" : "نُشر الدرس"); viewTeacher(); }
    if (b.dataset.act === "del") armDelete(b, async () => { await Store.deleteLesson(id); toast("حُذف الدرس"); viewTeacher(); });
  });
}

      <div id="e-errors" class="s-err"></div>
     </div>
     <aside class="ed-side">
      <section class="panel step s2"><h2><span class="n">٢</span>مقطع الدرس</h2>
        <div class="row"><input id="e-url" value="${esc(E.videoUrl || (E.videoId ? "https://youtu.be/" + E.videoId : ""))}" placeholder="رابط يوتيوب (عادي أو قصير أو Shorts)" style="flex:1 1 260px;direction:ltr;text-align:right"><button class="btn ghost" type="button" id="e-load">تحميل</button></div>
        <div class="video" id="e-vwrap" style="margin-top:12px" ${E.videoId ? "" : "hidden"}><div id="e-yt"></div></div>
        ${IS_LOCAL_FILE ? LOCAL_NOTE : ""}
        <p class="muted" style="font-size:.88rem;margin-top:8px">حرّك المقطع بحرية هنا، ثم اضغط «الوقت الحالي» في أي جزء لتعيين نهايته. يُعرض المقطع للطالبة دون أزرار التحكم.</p>

      <section class="panel step s5"><h2><span class="n">٥</span>النشر</h2>

          <span style="flex:1"></span>
          <button class="btn ghost" type="button" id="e-try">حفظ وتجربة كطالبة</button>

  $$("[data-b]").forEach(el => el.addEventListener("input", () => { E[el.dataset.b] = el.type === "number" ? Number(el.value) : el.value; }));
  $("#e-pass").addEventListener("change", e => (E.passPct = Number(e.target.value)));
  $("#e-pub").addEventListener("change", e => (E.published = e.target.checked));
  $("#e-speeds").addEventListener("change", () => { E.speeds = $$("#e-speeds input:checked").map(i => Number(i.value)); });
  $("#e-load").addEventListener("click", () => {
    const id = ytId($("#e-url").value);
    if (!id) { toast("لم أتعرّف على رابط يوتيوب. انسخه من شريط العنوان أو من زر المشاركة."); return; }
    E.videoId = id; E.videoUrl = $("#e-url").value.trim(); loadEditPlayer();
  });
  if (E.videoId) loadEditPlayer();
  drawEditorSegs();
  $("#ai-src").addEventListener("input", e => (E.source = e.target.value));
  $("#ai-count").addEventListener("change", e => (E.aiCount = Number(e.target.value)));
  $("#ai-gen").addEventListener("click", generateLessonQuestions);
  $("#bank").addEventListener("change", e => {
    const t = e.target, i = Number(t.dataset.i); if (!E.bank[i]) return;
    if (t.dataset.k === "bpick") E.bank[i].pick = t.checked;
    if (t.dataset.k === "bseg") E.bank[i].seg = Number(t.value);
    if (t.dataset.k === "bcorrect") E.bank[i].correct = Number(t.dataset.o);
  });
  $("#bank").addEventListener("input", e => {
    const t = e.target, i = Number(t.dataset.i); if (!E.bank[i]) return;
    if (t.dataset.k === "btext") E.bank[i].text = t.value;
    if (t.dataset.k === "bopt") E.bank[i].options[Number(t.dataset.o)] = t.value;
  });
  $("#bank").addEventListener("click", e => {
    const b = e.target.closest("[data-bact]"); if (!b) return;
    const act = b.dataset.bact;
    if (act === "drop") E.bank.splice(Number(b.dataset.i), 1);
    if (act === "all") { const on = !E.bank.every(q => q.pick); E.bank.forEach(q => (q.pick = on)); }
    if (act === "suggest") E.bank.forEach(q => (q.seg = segmentForTime(q.time)));
    if (act === "add") {
      const chosen = E.bank.filter(q => q.pick);
      if (!chosen.length) { toast("حدّد سؤالاً واحداً على الأقل."); return; }
      if (chosen.some(q => !(q.seg >= 0 && q.seg < E.segments.length))) { toast("اختر الجزء لكل سؤال محدد."); return; }
      const touched = new Set();
      chosen.forEach(q => {
        const seg = E.segments[q.seg];
        if (!touched.has(q.seg)) { seg.questions = seg.questions.filter(x => x.text.trim() || x.options.some(o => o.trim())); touched.add(q.seg); }
        seg.questions.push({ text: q.text, options: [...q.options], correct: q.correct });
      });
      E.bank = E.bank.filter(q => !q.pick);
      drawEditorSegs();
      toast(`أُضيف ${num(chosen.length)} سؤالاً إلى ${num(touched.size)} ${touched.size === 1 ? "جزء" : "أجزاء"}. راجعها قبل الحفظ.`);
      return;
    }
    drawBank();
  });
  const segBox = $("#e-segs");
  segBox.addEventListener("input", e => {
    const t = e.target, s = Number(t.dataset.s), q = Number(t.dataset.q), o = Number(t.dataset.o);
    if (t.dataset.k === "end") { E.segments[s].endText = t.value; markEnd(t); }
    if (t.dataset.k === "qtext") E.segments[s].questions[q].text = t.value;
    if (t.dataset.k === "opt") E.segments[s].questions[q].options[o] = t.value;
  });
  segBox.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.k === "correct") E.segments[Number(t.dataset.s)].questions[Number(t.dataset.q)].correct = Number(t.dataset.o);
    if (t.dataset.k === "move" && t.value !== "") {
      const si = Number(t.dataset.s), qi = Number(t.dataset.q);
      const [q] = E.segments[si].questions.splice(qi, 1);
      if (!E.segments[si].questions.length) E.segments[si].questions.push(blankQ());
      if (t.value === "bank") {
        E.bank = E.bank || [];
        E.bank.push({ text: q.text, options: [...q.options], correct: q.correct, time: null, seg: -1, pick: false });
        $("#ai-box").open = true;
        toast("نُقل السؤال إلى بنك الأسئلة.");
      } else {
        const to = E.segments[Number(t.value)];
        to.questions = to.questions.filter(x => x.text.trim() || x.options.some(o => o.trim()));
        to.questions.push(q);
        toast(`نُقل السؤال إلى الجزء ${num(Number(t.value) + 1)}.`);
      }
      drawEditorSegs();
    }
  });
  const onAct = e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const s = Number(b.dataset.s), q = Number(b.dataset.q), o = Number(b.dataset.o);
    const act = b.dataset.act;
    if (act === "addSeg") { E.segments.push({ endText: "", questions: [blankQ()] }); }
    else if (act === "delSeg") { if (E.segments.length > 1) E.segments.splice(s, 1); }
    else if (act === "now") {
      if (!EP.player || !EP.player.getCurrentTime) { toast("حمّل المقطع أولاً"); return; }
      E.segments[s].endText = fmtTime(EP.player.getCurrentTime());
    }
    else if (act === "addQ") E.segments[s].questions.push(blankQ());
    else if (act === "delQ") E.segments[s].questions.splice(q, 1);
    else if (act === "addOpt") E.segments[s].questions[q].options.push("");
    else if (act === "delOpt") {
      const qq = E.segments[s].questions[q]; qq.options.splice(o, 1);
      if (qq.correct === o) qq.correct = null; else if (qq.correct > o) qq.correct--;
    } else return;
    drawEditorSegs();
    if (act === "addSeg") $("#e-segs").lastElementChild.scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "center" });
  };
  segBox.addEventListener("click", onAct);
  $("#e-addseg").addEventListener("click", onAct);
  $("#e-save").addEventListener("click", () => saveDraft("save"));
  $("#e-try").addEventListener("click", () => saveDraft("try"));
}
function loadEditPlayer() {
  $("#e-vwrap").hidden = false;
  loadYT().then(() => {
    if (EP.player && EP.player.cueVideoById) { EP.player.cueVideoById(E.videoId); return; }
    EP.player = new YT.Player("e-yt", { videoId: E.videoId, playerVars: { rel: 0, playsinline: 1, modestbranding: 1, ...ytOrigin() } });
  });
}
function markEnd(el) {
  const v = parseTime(el.value);

  el.classList.toggle("bad", bad);
  el.title = bad ? "اكتب الوقت بصيغة دقائق:ثوانٍ، مثل 2:35" : (v != null ? "= " + num(v) + " ثانية" : "");
}

                <option value="">نقل إلى…</option>

                <option value="bank">بنك الأسئلة</option>
              </select>

async function generateLessonQuestions() {

// mode: "save" (حفظ والعودة للوحة)، "try" (حفظ وتجربة كطالب)، "auto" (حفظ صامت والبقاء في الصفحة)
async function saveDraft(mode = "save") {
  if (mode === true) mode = "try"; else if (mode === false) mode = "save";
  const errs = [];
  E.title = (E.title || "").trim();
  if (!E.title) errs.push("اكتب عنوان الدرس.");
  if (!E.videoId) { const id = ytId($("#e-url").value); if (id) { E.videoId = id; E.videoUrl = $("#e-url").value.trim(); } else errs.push("أضف رابط مقطع يوتيوب صحيحاً ثم اضغط «تحميل»."); }
  if (!E.speeds.length) E.speeds = [1];
  let prev = 0;
  const segments = E.segments.map((s, si) => {
    const last = si === E.segments.length - 1;
    const end = parseTime(s.endText);
    if (Number.isNaN(end)) errs.push(`الجزء ${num(si + 1)}: وقت النهاية غير صحيح، اكتبه بصيغة د:ث مثل 2:35.`);
    else if (end == null && !last) errs.push(`الجزء ${num(si + 1)}: حدّد وقت نهايته.`);
    else if (end != null) { if (end <= prev) errs.push(`الجزء ${num(si + 1)}: يجب أن تكون نهايته بعد نهاية الجزء السابق.`); prev = end; }
    const filled = s.questions.filter(q => q.text.trim() || q.options.some(o => o.trim()));
    if (!filled.length) errs.push(`الجزء ${num(si + 1)}: أضف سؤالاً واحداً على الأقل.`);
    const questions = s.questions.map((q, qi) => {
      const label = `الجزء ${num(si + 1)}، السؤال ${num(qi + 1)}`;
      const options = q.options.map(o => o.trim());
      const blank = !q.text.trim() && options.every(o => !o);
      if (!blank) {
        if (!q.text.trim()) errs.push(`${label}: اكتب نص السؤال.`);
        if (options.some(o => !o)) errs.push(`${label}: املأ كل الخيارات أو احذف الفارغ منها.`);
        if (q.correct == null || q.correct >= options.length) errs.push(`${label}: علّم الإجابة الصحيحة.`);
      }
      return { text: q.text.trim(), options, correct: q.correct ?? null };
    });
    // يُحفظ النص كما كُتب أيضاً حتى لا يضيع وقت غير مكتمل في المسودة
    return { end: Number.isNaN(end) ? null : end, endText: (s.endText || "").trim(), questions };
  });
  const complete = !errs.length;
  // السؤال الفارغ تماماً لا يُنشر للطالب
  if (complete) segments.forEach(sg => (sg.questions = sg.questions.filter(q => q.text || q.options.some(Boolean))));
  const wasPublished = !!E.published;
  const published = complete && wasPublished;
  const lesson = {
    title: E.title || "درس بلا عنوان", subject: E.subject, unit: (E.unit || "").trim(), gradeId: E.gradeId,
    teacher: (E.teacher || "").trim(), school: (E.school || "").trim(),
    videoId: E.videoId || "", videoUrl: E.videoUrl || "", passPct: Number(E.passPct) || 100,
    speeds: E.speeds.slice().sort((a, b) => a - b), published, complete, wantPublished: wasPublished, order: Number(E.order) || 0,
    segments, updatedAt: new Date().toISOString(),
    source: (E.source || "").trim(),
    bank: (E.bank || []).map(({ text, options, correct, time, seg }) => ({ text, options, correct, time: time ?? null, seg: seg ?? -1 }))
  };
  if (E.id) lesson.id = E.id;
  let id;
  try {
    id = await Store.saveLesson(lesson);
  } catch (e) {
    console.error(e);
    const hint = e.code === "22P02" || e.code === "42703" || e.code === "42P01"
      ? "قاعدة البيانات تحتاج تحديثاً: شغّل آخر نسخة من ملف supabase.sql في SQL Editor."
      : (e.message || e.code);
    toast("تعذّر الحفظ: " + hint + (e.code ? " (" + e.code + ")" : ""));
    return false;
  }
  ls.set("lastLesson", { gradeId: lesson.gradeId, subject: lesson.subject, teacher: lesson.teacher, school: lesson.school });
  if (!E.id) { E.id = id; history.replaceState(null, "", "#edit=" + encodeURIComponent(id)); }

  if (complete && mode !== "auto") {
    $("#e-errors").innerHTML = "";
    toast(published ? "حُفظ الدرس" : "حُفظ الدرس (غير منشور للطالبات)");
    location.hash = mode === "try" ? "lesson=" + encodeURIComponent(id) : "teacher";
    return true;
  }
  if (mode === "auto") {
    toast(complete ? "حُفظ الدرس تلقائياً" : "حُفظ الدرس تلقائياً كمسودة");
  } else {
    toast("حُفظ الدرس كمسودة");
  }
  if (!complete) {
    if (wasPublished) { const cb = $("#e-pub"); if (cb) cb.checked = true; }
    $("#e-errors").innerHTML = `<div class="errors"><b>حُفظ الدرس كمسودة${wasPublished ? "، ولن يظهر للطالبات حتى يكتمل" : ""}. أكمل ما يلي${mode === "try" ? " لتجربته كطالب" : ""}:</b><ul>${errs.slice(0, 12).map(e => `<li>${esc(e)}</li>`).join("")}${errs.length > 12 ? `<li>و${num(errs.length - 12)} ملاحظات أخرى.</li>` : ""}</ul></div>`;
    if (mode !== "auto") $("#e-errors").scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "center" });
  }
  return true;
}

async function freshLabHtml(lab) {
  if (!lab.readyFile || !/^labs\/[\w.-]+\.html$/.test(lab.readyFile)) return lab.html;
  try { const r = await fetch(lab.readyFile, { cache: "no-cache" }); if (r.ok) { const h = extractHtml(await r.text()); if (h) return h; } } catch {}

  catch { return ""; }

function extractHtml(text) {
  text = String(text || "").replace(/^\s*```(?:html)?\s*/i, "").replace(/```\s*$/i, "");
  const start = text.search(/<!doctype html|<html[\s>]/i);
  const end = text.toLowerCase().lastIndexOf("</html>");
  if (start < 0 || end < start) return "";
  return text.slice(start, end + 7);
}

        });
        sent = true;
        $("#ld-form .row").innerHTML = `<span>✓ وصلت نتيجتك إلى المعلمة.</span>`;
        $$("#ld-form input").forEach(i => (i.disabled = true));
        const tier = badgeTier(score);
        const badges = ls.get("badges", {}), key = "lab:" + lab.id;
        if (!badges[key] || TIERS.findIndex(t => t.key === badges[key]) > TIERS.indexOf(tier)) badges[key] = tier.key;
        ls.set("badges", badges);
        $("#ld-award").innerHTML = `
          <section class="award" style="margin-top:14px">
            <span class="eyebrow">شارة إنجاز · مختبر ${esc(lab.subject || "")}</span>
            ${medalSVG(tier, lab.subject)}
            <div class="tier" style="color:var(--t-${tier.key})">${tier.title}</div>
            <div class="who">${esc(name)}</div>
            <p>أنجزتِ مختبر <b>${esc(lab.title)}</b></p>
            <p class="score">${pct(score)}</p>
          </section>`;
      } catch (err) {
        console.error(err); btn.disabled = false;
        $("#ld-note").textContent = "تعذّر الإرسال. تأكدي من الاتصال ثم اضغطي مرة أخرى، أو التقطي صورة للشاشة وأرسليها للمعلمة.";
      }
    });
  };
  window.addEventListener("message", labMsgHandler);
}


// أسئلة المختبر للطالبة: تُسجَّل نتيجة المحاولة الأولى وتُمنح شارة
function drawLabQuiz(lab, grade) {
  const box = $("#lab-quiz"); if (!box) return;
  const qs = labQuizQs(lab);
  if (!qs.length) { box.innerHTML = ""; return; }
  const preview = !DEMO && state.isTeacher;
  const me = ls.get("student", { name: "", cls: "" });
  const st = { first: null, attempts: 0, started: Date.now() };
  box.innerHTML = `
    <form class="panel quiz" id="lq-form" style="margin-top:18px">
      <div><span class="eyebrow">بعد التجربة</span><h2>أسئلة المختبر</h2><p class="muted">${nQs(qs.length)}. ${preview ? "معاينة المعلمة: لن تُحفظ نتيجتك." : "ستصل نتيجتك إلى المعلمة، وتحصلين على شارة إنجاز."}</p></div>
      <div class="grid2">
        <label class="f">الاسم الكامل<input id="lqs-name" required maxlength="80" value="${esc(me.name)}" autocomplete="name"></label>
        <label class="f">الفصل / الشعبة<input id="lqs-cls" maxlength="30" value="${esc(me.cls)}" placeholder="مثال: ٢/أ"></label>
      </div>
      ${qs.map((x, qi) => `<fieldset class="qq" id="lqq${qi}" style="border:0;padding:0;margin:0"><p>${num(qi + 1)}. ${esc(x.text)}</p>
        ${x.options.map((o, oi) => `<label class="choice"><input type="radio" name="la${qi}" value="${oi}" id="la${qi}_${oi}">${esc(o)}</label>`).join("")}</fieldset>`).join("")}
      <div id="lq-verdict"></div>
      <div class="row" id="lq-btns"><button class="btn" type="submit">تحقّقي من إجاباتي</button></div>
      <div id="lq-award"></div>
    </form>`;
  const form = $("#lq-form");
  form.addEventListener("change", () => $$(".qq", form).forEach(f => f.classList.remove("wrong", "right")));
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#lqs-name").value.trim(), cls = $("#lqs-cls").value.trim();
    if (!name) { $("#lq-verdict").innerHTML = `<div class="verdict no">اكتبي اسمك أولاً.</div>`; $("#lqs-name").focus(); return; }
    const picks = qs.map((_, qi) => { const r = $(`input[name="la${qi}"]:checked`, form); return r ? Number(r.value) : null; });
    if (picks.some(p => p === null)) { $("#lq-verdict").innerHTML = `<div class="verdict no">أجيبي عن جميع الأسئلة أولاً.</div>`; return; }
    ls.set("student", { name, cls });
    let correct = 0;
    picks.forEach((p, qi) => { const okA = p === Number(qs[qi].correct); if (okA) correct++; $("#lqq" + qi).classList.add(okA ? "right" : "wrong"); });
    st.attempts++;
    const firstTime = st.first == null;
    if (firstTime) st.first = correct;
    const score = Math.round((st.first / qs.length) * 100);
    let note = "";
    if (firstTime && !preview) {
      try {
        await Store.addResult({
          labId: lab.id, lessonId: lab.id, lessonTitle: "مختبر: " + lab.title, subject: lab.subject || "",
          gradeId: lab.gradeId || "", gradeName: grade ? grade.name : "",
          studentName: name.slice(0, 80), studentClass: cls.slice(0, 30),
          correct: st.first, total: qs.length, score, attempts: 1,
          minutes: Math.max(1, Math.round((Date.now() - st.started) / 60000)), completedAt: new Date().toISOString()
        });
        note = "وصلت نتيجتك إلى المعلمة.";
      } catch (err) { console.error(err); note = "تعذّر إرسال النتيجة إلى المعلمة. التقطي صورة لشارتك وأرسليها لها."; }
    }
    const all = correct === qs.length;
    $("#lq-verdict").innerHTML = `<div class="verdict ${all ? "ok" : "no"}">${all ? "أحسنتِ! " : ""}أجبتِ عن ${num(correct)} من ${num(qs.length)} إجابة صحيحة${all ? "." : ". الإجابات المظلّلة بالأحمر تحتاج مراجعة، جرّبي المختبر مرة أخرى ثم أعيدي المحاولة."}</div>`;
    if (firstTime) {
      const tier = badgeTier(score);
      const mine = ls.get("badges", {}); const key = "lab:" + lab.id, prev = mine[key];
      if (!prev || TIERS.findIndex(t => t.key === prev) > TIERS.indexOf(tier)) mine[key] = tier.key;
      ls.set("badges", mine);
      $("#lq-award").innerHTML = `
        <section class="award">
          <span class="eyebrow">شارة إنجاز · مختبر ${esc(lab.subject || "")}</span>
          ${medalSVG(tier, lab.subject)}
          <div class="tier" style="color:var(--t-${tier.key})">${tier.title}</div>
          <div class="who">${esc(name)}</div>
          <p>أنجزتِ مختبر <b>${esc(lab.title)}</b></p>
          <p class="score">${pct(score)} · ${num(st.first)} من ${num(qs.length)} إجابات صحيحة من المحاولة الأولى</p>
          ${note ? `<p class="next">${note}</p>` : ""}
        </section>`;
    }
    $("#lq-btns").innerHTML = all ? "" : `<button class="btn ghost" type="button" id="lq-retry">حاولي مرة أخرى</button>`;
    $("#lq-retry")?.addEventListener("click", () => {
      $$(".qq", form).forEach(f => f.classList.remove("wrong", "right")); $$("input[type=radio]", form).forEach(i => (i.checked = false));
      $("#lq-btns").innerHTML = `<button class="btn" type="submit">تحقّقي من إجاباتي</button>`;
      $("#lq-verdict").innerHTML = "";
    });
    $("#lq-verdict").scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "start" });
  });
}

          <td>${!l.html ? `<span class="chip draft">مسودة بلا مختبر</span>` : l.published ? `<span class="chip bio">منشور</span>` : `<span class="chip draft">غير منشور</span>`}</td>
          <td><div class="row">
            <a class="btn ghost sm" href="#labedit=${encodeURIComponent(l.id)}">تعديل</a>
            <a class="btn ghost sm" href="#lab=${encodeURIComponent(l.id)}">فتح</a>
            <button class="btn ghost sm" type="button" data-act="link">نسخ الرابط</button>
            <button class="btn ghost sm" type="button" data-act="pub">${l.published ? "إخفاء" : "نشر"}</button>

  });
}

async function generateLabQuestions() {
  if (DEMO) { toast("توليد الأسئلة يعمل بعد ربط المنصة بـ Supabase."); return; }
  const parts = [];
  if ((LB.source || "").trim()) parts.push(LB.source.trim());
  if ((LB.request || "").trim()) parts.push("وصف المختبر: " + LB.request.trim());
  const inLab = labText(LB.html); if (inLab) parts.push("ما يظهر للطالبة داخل المختبر من شرح ومهام: " + inLab);
  const text = parts.join("\n\n");
  if (text.length < 120 && !LB.pdf) { toast("الصقي نص الدرس أو أرفقي ملف PDF أو اكتبي وصف المختبر أولاً، أو ابني المختبر."); return; }
  const grade = GRADES.find(g => g.id === LB.gradeId);
  const btn = $("#lq-gen"); btn.disabled = true; btn.textContent = "جارٍ التوليد…";
  try {
    const { data, error } = await sb.functions.invoke("generate-questions", {
      body: { text: text || "انظري ملف الدرس المرفق.", count: Number($("#lq-count").value) || 5, subject: LB.subject, grade: grade ? grade.name : "", title: LB.title || "", ...(LB.pdf ? { pdf: LB.pdf.data, pdfName: LB.pdf.name } : {}) }
    });
    if (error) { let msg = error.message; try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch {} throw new Error(msg); }
    const qs = (data && data.questions) || [];
    if (!qs.length) throw new Error("لم تصل أسئلة. جرّبي مرة أخرى.");
    LB.questions = LB.questions.filter(q => q.text.trim() || q.options.some(o => o.trim()));
    qs.forEach(q => LB.questions.push({ text: q.text, options: [...q.options], correct: q.correct }));
    drawLabQs(); await saveLab("auto");
    toast(`أُضيف ${nQs(qs.length)} وحُفظ المختبر. راجعيها وعدّلي ما تريدين.`);
  } catch (e) { console.error(e); toast("تعذّر توليد الأسئلة: " + (e.message || e)); }
  finally { btn.disabled = false; btn.textContent = "ولّدي الأسئلة"; }
}

async function runLabAI(isChange) {
  if (DEMO) { toast("بناء المختبر يعمل بعد ربط المنصة بـ Supabase. يمكنك الآن لصق كود مختبر جاهز للتجربة."); return; }
  const change = isChange ? ($("#lb-change").value || "").trim() : "";
  if (isChange && change.length < 3) { toast("اكتبي التعديل المطلوب."); return; }
  if (!isChange && !LB.pdf && (LB.request || "").trim().length < 10 && (LB.source || "").trim().length < 60) { toast("اكتبي وصف المختبر الذي تريدينه، أو الصقي نص الدرس، أو أرفقي ملف PDF."); return; }
  const grade = GRADES.find(g => g.id === LB.gradeId);
  const buttons = ["#lb-build", "#lb-apply", "#lb-save"].map(x => $(x)).filter(Boolean);
  buttons.forEach(b => (b.disabled = true));
  $("#lb-msg").innerHTML = "";
  const started = Date.now();
  let got = "";
  const tick = setInterval(() => drawLabPreview(`مرّ ${num(Math.round((Date.now() - started) / 1000))} ثانية · كُتب ${num(got.length)} حرف`), 1000);
  drawLabPreview("جارٍ الاتصال…");
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error("انتهت جلسة الدخول، سجّلي الدخول مرة أخرى.");
    const res = await fetch(SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/generate-questions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token, apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({
        kind: "lab", title: LB.title, subject: LB.subject, grade: grade ? grade.name : "",
        text: LB.source || "", request: LB.request || "",
        ...(LB.pdf && !isChange ? { pdf: LB.pdf.data, pdfName: LB.pdf.name } : {}),
        previousHtml: isChange ? LB.html : "", change
      })
    });
    if (!res.ok) {
      let msg = res.status + " " + res.statusText;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
      if (res.status === 404) msg = "لم تُحدَّث دالة generate-questions في Supabase بعد بالنسخة التي تدعم المختبرات.";
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      got += dec.decode(value, { stream: true });
    }
    const err = got.match(/<!--LABEEBA:ERROR:([\s\S]*?)-->/);
    if (err) throw new Error("خطأ من خدمة Claude: " + err[1]);
    const truncated = got.includes("<!--LABEEBA:TRUNCATED-->");
    const html = extractHtml(got.replace("<!--LABEEBA:TRUNCATED-->", ""));
    if (!html) throw new Error(truncated ? "انقطع البناء لأن المختبر أطول من الحد المسموح. اطلبي مختبراً أبسط بمهام أقل." : "لم يصل ملف مختبر كامل. جرّبي مرة أخرى.");
    LB.prevHtml = LB.html || "";
    LB.html = html; LB.readyFile = "";
    if (isChange) $("#lb-change").value = "";
    clearInterval(tick);
    drawLabPreview();
    await saveLab("auto");
    toast(isChange ? "طُبّق التعديل وحُفظ المختبر." : "بُني المختبر وحُفظ. جرّبيه الآن.");
  } catch (e) {
    console.error(e);
    clearInterval(tick);
    drawLabPreview();
    $("#lb-msg").innerHTML = `<div class="errors"><b>تعذّر بناء المختبر:</b> ${esc(e.message || e)}</div>`;
  } finally {
    clearInterval(tick);
    buttons.forEach(b => (b.disabled = false));
  }
}
async function saveLab(mode) {
  LB.title = (LB.title || "").trim();
  const ready = !!LB.html;
  const lab = {
    title: LB.title || "مختبر بلا عنوان", subject: LB.subject, unit: (LB.unit || "").trim(), gradeId: LB.gradeId, lessonId: LB.lessonId || "",
    source: (LB.source || "").trim(), request: (LB.request || "").trim(), html: LB.html || "", prevHtml: LB.prevHtml || "", readyFile: LB.readyFile || "", pdfName: LB.pdfName || "",
    published: ready && !!LB.published, order: Number(LB.order) || 0, updatedAt: new Date().toISOString(),
    questions: (LB.questions || []).map(q => ({ text: q.text.trim(), options: q.options.map(o => o.trim()), correct: q.correct ?? null })),
    kind: "lab"
  };
  const filledQs = lab.questions.filter(q => q.text || q.options.some(Boolean));
  const badQs = filledQs.filter(q => !q.text || q.options.some(o => !o) || q.correct == null || q.correct >= q.options.length).length;
  if (LB.id) lab.id = LB.id;
  try {
    const id = await Store.saveLab(lab);
    if (!LB.id) { LB.id = id; history.replaceState(null, "", "#labedit=" + encodeURIComponent(id)); }
    $("#lb-h1") && ($("#lb-h1").textContent = lab.title);
    if (mode === "try") {
      toast("حُفظ المختبر. هذه معاينتك كطالبة، ولن تُرسل نتيجتك.");
      location.hash = "#lab=" + encodeURIComponent(LB.id);
      return true;
    }
    if (mode === "save") {
      toast((!ready ? "حُفظ المختبر كمسودة (لم يُبنَ بعد)" : lab.published ? "حُفظ المختبر ونُشر للطالبات" : "حُفظ المختبر (غير منشور)") + (badQs === 1 ? " · سؤال واحد غير مكتمل لن يظهر للطالبات" : badQs > 1 ? ` · ${nQs(badQs)} غير مكتملة لن تظهر للطالبات` : ""));
      location.hash = "labs";
    }
    return true;
  } catch (e) {
    console.error(e);
    const hint = e.code === "42P01" || /labs/.test(e.message || "") ? "جدول المختبرات غير موجود: شغّلي آخر نسخة من ملف supabase.sql." : (e.message || e.code);
    toast("تعذّر حفظ المختبر: " + hint);
    return false;
  }
}

        $$("#ld-form input").forEach(i => (i.disabled = true));

            <div class="who">${esc(name)}</div>
            <p>أنجزتِ الدرس التفاعلي <b>${esc(lab.title)}</b></p>
