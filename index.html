          </section>`;
      } catch (err) {
        console.error(err); btn.disabled = false;
        $("#ld-note").textContent = "تعذّر الإرسال. تأكدي من الاتصال ثم اضغطي مرة أخرى، أو التقطي صورة للشاشة وأرسليها للمعلمة.";
      }
    });
  };
  window.addEventListener("message", labMsgHandler);
}


// أسئلة الدرس التفاعلي للطالبة: تُسجَّل نتيجة المحاولة الأولى وتُمنح شارة
function drawILQuiz(lab, grade) {
  const box = $("#lab-quiz"); if (!box) return;
  const qs = labQuizQs(lab);
  if (!qs.length) { box.innerHTML = ""; return; }
  const preview = !DEMO && state.isTeacher;
  const me = ls.get("student", { name: "", cls: "" });
  const st = { first: null, attempts: 0, started: Date.now() };
  box.innerHTML = `
    <form class="panel quiz" id="lq-form" style="margin-top:18px">
      <div><span class="eyebrow">بعد التجربة</span><h2>أسئلة الدرس التفاعلي</h2><p class="muted">${nQs(qs.length)}. ${preview ? "معاينة المعلمة: لن تُحفظ نتيجتك." : "ستصل نتيجتك إلى المعلمة، وتحصلين على شارة إنجاز."}</p></div>
      <div class="grid2">
        <label class="f">الاسم الكامل<input id="lqs-name" required maxlength="80" value="${esc(me.name)}" autocomplete="name"></label>
        <label class="f">الفصل / الشعبة<input id="lqs-cls" maxlength="30" value="${esc(me.cls)}" placeholder="مثال: ٢/أ"></label>
      </div>
      ${qs.map((x, qi) => `<fieldset class="qq" id="lqq${qi}" style="border:0;padding:0;margin:0"><p>${num(qi + 1)}. ${esc(x.text)}</p>
        ${x.options.map((o, oi) => `<label class="choice"><input type="radio" name="la${qi}" value="${oi}" id="la${qi}_${oi}">${esc(o)}</label>`).join("")}</fieldset>`).join("")}
      <div id="lq-verdict"></div>
      <div class="row" id="lq-btns"><button class="btn" type="submit">تحقّقي من إجاباتي</button></div>
      <div id="lq-award"></div>
    </form>`;
  const form = $("#lq-form");
  form.addEventListener("change", () => $$(".qq", form).forEach(f => f.classList.remove("wrong", "right")));
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#lqs-name").value.trim(), cls = $("#lqs-cls").value.trim();
    if (!name) { $("#lq-verdict").innerHTML = `<div class="verdict no">اكتبي اسمك أولاً.</div>`; $("#lqs-name").focus(); return; }
    const picks = qs.map((_, qi) => { const r = $(`input[name="la${qi}"]:checked`, form); return r ? Number(r.value) : null; });
    if (picks.some(p => p === null)) { $("#lq-verdict").innerHTML = `<div class="verdict no">أجيبي عن جميع الأسئلة أولاً.</div>`; return; }
    ls.set("student", { name, cls });
    let correct = 0;
    picks.forEach((p, qi) => { const okA = p === Number(qs[qi].correct); if (okA) correct++; $("#lqq" + qi).classList.add(okA ? "right" : "wrong"); });
    st.attempts++;
    const firstTime = st.first == null;
    if (firstTime) st.first = correct;
    const score = Math.round((st.first / qs.length) * 100);
    let note = "";
    if (firstTime && !preview) {
      try {
        await Store.addResult({
          labId: lab.id, lessonId: lab.id, lessonTitle: "درس تفاعلي: " + lab.title, subject: lab.subject || "",
          gradeId: lab.gradeId || "", gradeName: grade ? grade.name : "",
          studentName: name.slice(0, 80), studentClass: cls.slice(0, 30),
          correct: st.first, total: qs.length, score, attempts: 1,
          minutes: Math.max(1, Math.round((Date.now() - st.started) / 60000)), completedAt: new Date().toISOString()
        });
        note = "وصلت نتيجتك إلى المعلمة.";
      } catch (err) { console.error(err); note = "تعذّر إرسال النتيجة إلى المعلمة. التقطي صورة لشارتك وأرسليها لها."; }
    }
    const all = correct === qs.length;
    $("#lq-verdict").innerHTML = `<div class="verdict ${all ? "ok" : "no"}">${all ? "أحسنتِ! " : ""}أجبتِ عن ${num(correct)} من ${num(qs.length)} إجابة صحيحة${all ? "." : ". الإجابات المظلّلة بالأحمر تحتاج مراجعة، جرّبي الدرس التفاعلي مرة أخرى ثم أعيدي المحاولة."}</div>`;
    if (firstTime) {
      const tier = badgeTier(score);
      const mine = ls.get("badges", {}); const key = "lab:" + lab.id, prev = mine[key];
      if (!prev || TIERS.findIndex(t => t.key === prev) > TIERS.indexOf(tier)) mine[key] = tier.key;
      ls.set("badges", mine);
      $("#lq-award").innerHTML = `
        <section class="award">
          <span class="eyebrow">شارة إنجاز · درس تفاعلي ${esc(lab.subject || "")}</span>
          ${medalSVG(tier, lab.subject)}
          <div class="tier" style="color:var(--t-${tier.key})">${tier.title}</div>
          <div class="who">${esc(name)}</div>
          <p>أنجزتِ الدرس التفاعلي <b>${esc(lab.title)}</b></p>
          <p class="score">${pct(score)} · ${num(st.first)} من ${num(qs.length)} إجابات صحيحة من المحاولة الأولى</p>
          ${note ? `<p class="next">${note}</p>` : ""}
        </section>`;
    }
    $("#lq-btns").innerHTML = all ? "" : `<button class="btn ghost" type="button" id="lq-retry">حاولي مرة أخرى</button>`;
    $("#lq-retry")?.addEventListener("click", () => {
      $$(".qq", form).forEach(f => f.classList.remove("wrong", "right")); $$("input[type=radio]", form).forEach(i => (i.checked = false));
      $("#lq-btns").innerHTML = `<button class="btn" type="submit">تحقّقي من إجاباتي</button>`;
      $("#lq-verdict").innerHTML = "";
    });
    $("#lq-verdict").scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "start" });
  });
}

}

async function generateILQuestions() {
  if (DEMO) { toast("توليد الأسئلة يعمل بعد ربط المنصة بـ Supabase."); return; }
  const parts = [];
  if ((IL.source || "").trim()) parts.push(IL.source.trim());
  if ((IL.request || "").trim()) parts.push("وصف الدرس التفاعلي: " + IL.request.trim());
  const inLab = labText(IL.html); if (inLab) parts.push("ما يظهر للطالبة داخل الدرس التفاعلي من شرح ومهام: " + inLab);
  const text = parts.join("\n\n");
  if (text.length < 120 && !IL.pdf) { toast("الصقي نص الدرس أو أرفقي ملف PDF أو اكتبي وصف الدرس التفاعلي أولاً، أو ابني الدرس التفاعلي."); return; }
  const grade = GRADES.find(g => g.id === IL.gradeId);
  const btn = $("#lq-gen"); btn.disabled = true; btn.textContent = "جارٍ التوليد…";
  try {
    const { data, error } = await sb.functions.invoke("generate-questions", {
      body: { text: text || "انظري ملف الدرس المرفق.", count: Number($("#lq-count").value) || 5, subject: IL.subject, grade: grade ? grade.name : "", title: IL.title || "", ...(IL.pdf ? { pdf: IL.pdf.data, pdfName: IL.pdf.name } : {}) }
    });
    if (error) { let msg = error.message; try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch {} throw new Error(msg); }
    const qs = (data && data.questions) || [];
    if (!qs.length) throw new Error("لم تصل أسئلة. جرّبي مرة أخرى.");
    IL.questions = IL.questions.filter(q => q.text.trim() || q.options.some(o => o.trim()));
    qs.forEach(q => IL.questions.push({ text: q.text, options: [...q.options], correct: q.correct }));
    drawILQs(); await saveIL("auto");
    toast(`أُضيف ${nQs(qs.length)} وحُفظ الدرس التفاعلي. راجعيها وعدّلي ما تريدين.`);
  } catch (e) { console.error(e); toast("تعذّر توليد الأسئلة: " + (e.message || e)); }
  finally { btn.disabled = false; btn.textContent = "ولّدي الأسئلة"; }
}

async function runILAI(isChange) {
  if (DEMO) { toast("بناء الدرس التفاعلي يعمل بعد ربط المنصة بـ Supabase. يمكنك الآن لصق كود درس تفاعلي جاهز للتجربة."); return; }
  const change = isChange ? ($("#lb-change").value || "").trim() : "";
  if (isChange && change.length < 3) { toast("اكتبي التعديل المطلوب."); return; }
  if (!isChange && !IL.pdf && (IL.request || "").trim().length < 10 && (IL.source || "").trim().length < 60) { toast("اكتبي وصف الدرس التفاعلي الذي تريدينه، أو الصقي نص الدرس، أو أرفقي ملف PDF."); return; }
  const grade = GRADES.find(g => g.id === IL.gradeId);
  const buttons = ["#lb-build", "#lb-apply", "#lb-save"].map(x => $(x)).filter(Boolean);
  buttons.forEach(b => (b.disabled = true));
  $("#lb-msg").innerHTML = "";
  const started = Date.now();
  let got = "";
  const tick = setInterval(() => drawILPreview(`مرّ ${num(Math.round((Date.now() - started) / 1000))} ثانية · كُتب ${num(got.length)} حرف`), 1000);
  drawILPreview("جارٍ الاتصال…");
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error("انتهت جلسة الدخول، سجّلي الدخول مرة أخرى.");
    const res = await fetch(SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/generate-questions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token, apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({
        kind: "interactive", title: IL.title, subject: IL.subject, grade: grade ? grade.name : "",
        text: IL.source || "", request: IL.request || "",
        ...(IL.pdf && !isChange ? { pdf: IL.pdf.data, pdfName: IL.pdf.name } : {}),
        previousHtml: isChange ? IL.html : "", change
      })
    });
    if (!res.ok) {
      let msg = res.status + " " + res.statusText;
      try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
      if (res.status === 404) msg = "لم تُحدَّث دالة generate-questions في Supabase بعد بالنسخة التي تدعم الدروس التفاعلية.";
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      got += dec.decode(value, { stream: true });
    }
    const err = got.match(/<!--LABEEBA:ERROR:([\s\S]*?)-->/);
    if (err) throw new Error("خطأ من خدمة Claude: " + err[1]);
    const truncated = got.includes("<!--LABEEBA:TRUNCATED-->");
    const html = extractHtml(got.replace("<!--LABEEBA:TRUNCATED-->", ""));
    if (!html) throw new Error(truncated ? "انقطع البناء لأن الدرس التفاعلي أطول من الحد المسموح. اطلبي درساً تفاعلياً أبسط بمهام أقل." : "لم يصل ملف درس تفاعلي كامل. جرّبي مرة أخرى.");
    IL.prevHtml = IL.html || "";
    IL.html = html; IL.readyFile = "";
    if (isChange) $("#lb-change").value = "";
    clearInterval(tick);
    drawILPreview();
    await saveIL("auto");
    toast(isChange ? "طُبّق التعديل وحُفظ الدرس التفاعلي." : "بُني الدرس التفاعلي وحُفظ. جرّبيه الآن.");
  } catch (e) {
    console.error(e);
    clearInterval(tick);
    drawILPreview();
    $("#lb-msg").innerHTML = `<div class="errors"><b>تعذّر بناء الدرس التفاعلي:</b> ${esc(e.message || e)}</div>`;
  } finally {
    clearInterval(tick);
    buttons.forEach(b => (b.disabled = false));
  }
}
async function saveIL(mode) {
  IL.title = (IL.title || "").trim();
  const ready = !!IL.html;
  const lab = {
    title: IL.title || "درس تفاعلي بلا عنوان", subject: IL.subject, unit: (IL.unit || "").trim(), gradeId: IL.gradeId, lessonId: IL.lessonId || "",
    source: (IL.source || "").trim(), request: (IL.request || "").trim(), html: IL.html || "", prevHtml: IL.prevHtml || "", readyFile: IL.readyFile || "", pdfName: IL.pdfName || "",
    published: ready && !!IL.published, order: Number(IL.order) || 0, updatedAt: new Date().toISOString(),
    questions: (IL.questions || []).map(q => ({ text: q.text.trim(), options: q.options.map(o => o.trim()), correct: q.correct ?? null })),
    kind: "interactive"
  };
  const filledQs = lab.questions.filter(q => q.text || q.options.some(Boolean));
  const badQs = filledQs.filter(q => !q.text || q.options.some(o => !o) || q.correct == null || q.correct >= q.options.length).length;
  if (IL.id) lab.id = IL.id;
  try {
    const id = await Store.saveLab(lab);
    if (!IL.id) { IL.id = id; history.replaceState(null, "", "#iledit=" + encodeURIComponent(id)); }
    $("#lb-h1") && ($("#lb-h1").textContent = lab.title);
    if (mode === "try") {
      toast("حُفظ الدرس التفاعلي. هذه معاينتك كطالبة، ولن تُرسل نتيجتك.");
      location.hash = "#ilesson=" + encodeURIComponent(IL.id);
      return true;
    }
    if (mode === "save") {
      toast((!ready ? "حُفظ الدرس التفاعلي كمسودة (لم يُبنَ بعد)" : lab.published ? "حُفظ الدرس التفاعلي ونُشر للطالبات" : "حُفظ الدرس التفاعلي (غير منشور)") + (badQs === 1 ? " · سؤال واحد غير مكتمل لن يظهر للطالبات" : badQs > 1 ? ` · ${nQs(badQs)} غير مكتملة لن تظهر للطالبات` : ""));
      location.hash = "ilessons";
    }
    return true;
  } catch (e) {
    console.error(e);
    const hint = e.code === "42P01" || /labs/.test(e.message || "") ? "جدول الدروس التفاعلية غير موجود: شغّلي آخر نسخة من ملف supabase.sql." : (e.message || e.code);
    toast("تعذّر حفظ الدرس التفاعلي: " + hint);
    return false;
  }
}

    $("#stats").innerHTML = `<div><span class="muted">دروس مكتملة</span><b>${num(rows.length)}</b></div><div><span class="muted">طلاب</span><b>${num(students)}</b></div><div><span class="muted">متوسط الدرجة</span><b>${rows.length ? pct(avg) : "—"}</b></div>`;
    $("#rtable").innerHTML = rows.length ? `<div class="table-wrap"><table>
      <thead><tr><th>الطالبة</th><th>الفصل</th><th>الدرس</th><th>الصف</th><th>الدرجة</th><th>المحاولات</th><th>التاريخ</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr data-id="${esc(r.id)}"><td><b>${esc(r.studentName)}</b></td><td>${esc(r.studentClass || "—")}</td><td>${esc(r.lessonTitle)}</td><td>${esc(r.gradeName || "")}</td>
        <td class="num"><span class="chip ${Number(r.score) >= 80 ? "bio" : Number(r.score) >= 50 ? "sci" : "draft"}">${pct(r.score)}</span> <span class="muted">${num(r.correct)}/${num(r.total)}</span></td>
        <td class="num">${num(r.attempts)}</td><td class="num">${esc(new Date(r.completedAt).toLocaleString("ar-SA", { dateStyle: "medium", timeStyle: "short" }))}</td>
        <td><button class="btn danger sm" type="button" data-act="del">حذف</button></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><h2>لا نتائج بعد</h2><p>تظهر هنا نتيجة كل طالبة تُكمل درساً: اسمها وفصلها ودرجتها من المحاولة الأولى.</p></div>`;
  };
  fillLessons(); draw();
  $("#f-grade").addEventListener("change", e => { f.grade = e.target.value; fillLessons(); draw(); });
  $("#f-lesson").addEventListener("change", e => { f.lesson = e.target.value; draw(); });
  $("#f-q").addEventListener("input", e => { f.q = e.target.value.trim(); draw(); });
  $("#rtable").addEventListener("click", e => {
    const b = e.target.closest("button[data-act=del]"); if (!b) return;
    const id = b.closest("tr").dataset.id;
    armDelete(b, async () => { await Store.deleteResult(id); const i = results.findIndex(r => r.id === id); if (i >= 0) results.splice(i, 1); draw(); toast("حُذفت النتيجة"); });
  });
  $("#csv").addEventListener("click", () => {
    const rows = filtered();
    const head = ["الطالبة", "الفصل", "الصف", "المادة", "الدرس", "الدرجة %", "الصحيح", "عدد الأسئلة", "المحاولات", "الدقائق", "التاريخ"];
    const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = "﻿" + [head, ...rows.map(r => [r.studentName, r.studentClass, r.gradeName, r.subject, r.lessonTitle, r.score, r.correct, r.total, r.attempts, r.minutes, new Date(r.completedAt).toLocaleString("en-GB")])].map(r => r.map(cell).join(",")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "نتائج-الطالبات.csv"; document.body.appendChild(a); a.click(); a.remove();
  });
}

/* ======================= التشغيل ======================= */
(function boot() {
  document.title = SITE_NAME; $("#site-tag").textContent = SITE_TAGLINE_AR;
  if (DEMO) {
    $("#demo").hidden = false;
  } else {
    try {
      SupaStore.init(); Store = SupaStore;
      let lastUser;
      sb.auth.onAuthStateChange((event, session) => {
        const u = session ? session.user : null;
        if (state.authReady && (u && u.id) === (lastUser && lastUser.id)) return; // تحديث الرمز فقط
        lastUser = u;
        // التحقق من أن الحساب معلم (جدول teachers)؛ setTimeout لتجنّب الاستدعاء داخل حدث المصادقة
        setTimeout(async () => {
          state.user = u;
          let teacher = false;
          if (u) { try { teacher = !!ok(await sb.rpc("is_teacher")); } catch (e) { console.error(e); } }
          state.isTeacher = teacher; state.authReady = true;
          route();
        }, 0);
      });
    } catch (e) {
      console.error(e);
      app.innerHTML = `<div class="empty"><h2>إعدادات Supabase غير صحيحة</h2><p>راجع الرابط والمفتاح في أعلى الملف. (${esc(e.message)})</p></div>`;
      return;
    }
  }
  window.addEventListener("hashchange", route);
  if (DEMO) route(); // في وضع Supabase تبدأ الصفحة بعد التحقق من حالة الدخول
})();
</script>
</body>
