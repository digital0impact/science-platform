<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: three columns in RTL — phylum cards (right), 3D stage (centre), glass study panel (left); stacks on phones */
:root{
  --bg:#f5efe6;--g1:#fff7ec;--g2:#e5f1ef;--g3:#f4e6d8;
  --ink:#1f1c1a;--ink2:#5c5550;--line:rgba(70,50,30,.11);
  --glass:rgba(255,252,248,.64);--glass2:rgba(255,252,248,.86);--edge:rgba(255,255,255,.8);--tile:rgba(255,255,255,.58);--raised:#fff;
  --shadow:rgba(90,60,30,.32);--good:#2f8a55;--bad:#c2473f;
  --accent:#2f9fb0;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --sans:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121719;--g1:#1b2427;--g2:#14232a;--g3:#1d1b1a;--ink:#ecebe6;--ink2:#a7aeac;--line:rgba(255,255,255,.1);
  --glass:rgba(30,37,40,.66);--glass2:rgba(36,44,47,.9);--edge:rgba(255,255,255,.08);--tile:rgba(255,255,255,.05);--raised:#2c3639;
  --shadow:rgba(0,0,0,.6);--good:#5cc489;--bad:#ef7b72;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121719;--g1:#1b2427;--g2:#14232a;--g3:#1d1b1a;--ink:#ecebe6;--ink2:#a7aeac;--line:rgba(255,255,255,.1);
  --glass:rgba(30,37,40,.66);--glass2:rgba(36,44,47,.9);--edge:rgba(255,255,255,.08);--tile:rgba(255,255,255,.05);--raised:#2c3639;
  --shadow:rgba(0,0,0,.6);--good:#5cc489;--bad:#ef7b72;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(900px 620px at 52% 46%,var(--g1) 0,transparent 70%),radial-gradient(700px 500px at 15% 10%,var(--g2),transparent 70%),radial-gradient(800px 600px at 90% 90%,var(--g3),transparent 70%),var(--bg);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--edge);box-shadow:0 18px 50px -28px var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
h1,h2,.brand,.kv dd,.fn b,.know{font-family:var(--display);text-wrap:balance}

.bub{position:fixed;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),color-mix(in srgb,var(--accent) 22%,transparent) 60%,transparent);animation:float 14s ease-in-out infinite;opacity:.8}
@keyframes float{50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}

header{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:20px max(16px,44px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:21px}
.brand i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9fd9e2 40%,#2f9fb0 72%,#1d5b6b);box-shadow:0 4px 10px rgba(30,110,130,.3)}
.brand small{display:block;font:500 12px var(--sans);color:var(--ink2);margin-top:-2px}
nav{display:flex;gap:32px}
nav a{position:relative;color:var(--ink2);text-decoration:none;font-size:15px;font-weight:500;padding:6px 0;white-space:nowrap}
nav a[aria-current=page]{color:var(--ink)}
nav a[aria-current=page]:after{content:"";position:absolute;left:30%;right:30%;bottom:-4px;height:1px;background:var(--ink)}
nav a.vid{color:var(--accent);font-weight:600}
.search{justify-self:end;position:relative;width:250px}
.search input{width:100%;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--glass2);padding:0 42px 0 16px;font-size:14px;outline:none}
.search svg{position:absolute;inset-inline-start:16px;top:14px;width:16px;height:16px;color:var(--ink2)}
.results{position:absolute;inset-inline-end:0;top:48px;width:300px;max-height:320px;overflow:auto;border-radius:16px;padding:6px}
.results button{display:block;width:100%;text-align:start;padding:9px 12px;border-radius:10px;font-size:15px;font-weight:500}
.results button:hover,.results button:focus-visible{background:var(--tile)}
.results small{display:block;color:var(--ink2);font-size:12.5px;font-weight:400}

.app{position:relative;z-index:1;display:grid;grid-template-columns:262px minmax(0,1fr) 392px;gap:28px;padding:6px 44px 28px;min-height:calc(100svh - 84px)}

.side{display:flex;flex-direction:column;gap:12px}
.card{display:grid;grid-template-columns:72px 1fr 14px;gap:14px;align-items:center;padding:12px;border-radius:22px;text-align:start;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-1px)}
.card img{width:72px;height:80px;border-radius:14px;object-fit:cover;background:color-mix(in srgb,var(--accent) 12%,var(--tile));display:block}
.card b{display:block;font:600 17px/1.3 var(--display)}
.card small{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.card em{display:block;font-style:normal;font-size:11.5px;letter-spacing:.04em;color:var(--accent);font-family:system-ui,sans-serif;direction:ltr;text-align:end}
.card svg{width:14px;height:14px;color:var(--ink2)}
.card[aria-pressed=true]{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 18px 50px -28px var(--shadow),0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent)}
.count{color:var(--ink2);font-size:14px;margin:4px 14px 0}
.tagline{margin-top:auto;font:600 22px/1.35 var(--display);color:var(--ink)}
.tagline span{display:block;font:400 14px/1.6 var(--sans);color:var(--ink2);margin-top:8px}

.stage{position:relative;min-height:640px}
#gl{position:absolute;inset:-20px -10px 76px;touch-action:pan-y}
#gl canvas{display:block;width:100%!important;height:100%!important;touch-action:pan-y}
#calls{position:absolute;inset:0;pointer-events:none;direction:ltr}
.call{position:absolute;z-index:2;left:0;top:0;font:600 14.5px/1.3 var(--sans);white-space:nowrap;pointer-events:auto;transition:opacity .3s;padding:5px 12px;border-radius:99px;background:var(--glass2);border:1px solid var(--edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);direction:rtl}
.call.off{opacity:0;pointer-events:none}
.lead{position:absolute;z-index:1;left:0;top:0;height:1px;background:color-mix(in srgb,var(--ink) 40%,transparent);transform-origin:0 50%;pointer-events:none;transition:opacity .3s}
.dot{position:absolute;z-index:1;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--raised);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ink) 60%,transparent);pointer-events:none;transition:opacity .3s}
.lead.off,.dot.off{opacity:0}
.hint{position:absolute;top:4px;inset-inline-start:0;font-size:13px;color:var(--ink2);z-index:2;pointer-events:none}

.bar{position:absolute;z-index:3;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px;border-radius:99px;direction:ltr}
.bar>*{height:46px;border-radius:99px;background:var(--glass2);border:1px solid var(--edge);display:flex;align-items:center}
.bar .ic{width:46px;justify-content:center}
.bar .ic svg{width:18px;height:18px}
.zoom{gap:12px;padding:0 16px}
.zoom button{width:20px;height:20px;font-size:18px;line-height:1;display:grid;place-items:center}
.zoom input{width:100px;-webkit-appearance:none;appearance:none;height:1px;background:color-mix(in srgb,var(--ink) 30%,transparent)}
.zoom input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink2);border:0}
.zoom input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink2);border:0}
.mode{padding:4px;gap:2px}
.mode button{height:36px;padding:0 18px;border-radius:99px;font-weight:600;font-size:14px;color:var(--ink2);font-family:system-ui,sans-serif}
.mode button[aria-pressed=true]{background:var(--raised);color:var(--ink);box-shadow:0 4px 12px -6px var(--shadow)}

.panel{border-radius:28px;padding:26px 24px 16px;display:flex;flex-direction:column;max-height:calc(100svh - 110px);position:sticky;top:20px;min-width:0}
.kick{display:flex;justify-content:space-between;font-size:14px;font-weight:500;color:var(--ink2)}
.kick span:last-child{font-variant-numeric:tabular-nums;direction:ltr}
.panel h1{font-weight:700;font-size:clamp(38px,3.4vw,50px);line-height:1.15;margin:10px 0 2px}
.latin{font:500 14px system-ui,sans-serif;color:var(--accent);letter-spacing:.06em;direction:ltr;text-align:end;margin-bottom:10px}
.lede{font-size:16.5px;line-height:1.75;color:var(--ink2);margin:0 0 16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:0 0 16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.kv dt{font-size:13px;color:var(--ink2)}
.kv dd{margin:2px 0 0;font-weight:600;font-size:16.5px;line-height:1.4}
.kv div.wide{grid-column:1/-1}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:99px;background:var(--tile);border:1px solid var(--edge);margin-bottom:12px}
.tabs button{height:40px;border-radius:99px;font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--raised);color:var(--ink);font-weight:600;box-shadow:0 4px 12px -6px var(--shadow)}
.pane{overflow-y:auto;min-height:0;flex:1;margin:0 -8px;padding:0 8px 6px;scrollbar-width:thin}
.st{border-radius:18px;background:var(--tile);border:1px solid var(--edge);margin-bottom:10px}
.st>button{display:grid;grid-template-columns:72px 1fr 22px;gap:14px;align-items:center;width:100%;text-align:start;padding:10px 10px 10px 14px}
.st img,.st .ph{width:72px;height:66px;border-radius:12px;object-fit:cover;display:block;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.st .ph{background:radial-gradient(circle at 40% 40%,var(--raised),color-mix(in srgb,var(--accent) 30%,transparent))}
.st b{display:block;font-weight:600;font-size:16px;line-height:1.4}
.st b i{font:400 12px system-ui,sans-serif;color:var(--ink2);font-style:normal;margin-inline-start:6px}
.st span{display:block;font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:2px}
.st .pm{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font-size:15px;font-style:normal;line-height:1;color:var(--ink2)}
.st .more{display:none;padding:0 98px 14px 16px;font-size:14.5px;color:var(--ink2)}
.st.open .more{display:block}
.linkbtn{color:var(--ink);font-weight:600;border-bottom:1px solid var(--accent);cursor:pointer;margin-inline-start:4px}
.fn{padding:12px 4px;border-bottom:1px solid var(--line)}
.fn b{display:block;font-weight:600;font-size:18px;line-height:1.4}
.fn span{color:var(--ink2);font-size:14.5px}
.know{font-weight:600;font-size:19px;line-height:1.55;margin:16px 4px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 14px}
.chips span{font-size:13px;font-weight:600;border-radius:99px;padding:6px 12px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.note{font-size:13px;color:var(--ink2);margin:8px 4px 0}
.box{border-radius:18px;background:var(--tile);border:1px solid var(--edge);padding:14px 16px;margin:14px 0 6px}
.box h2{font-size:16px;font-weight:600;margin:0 0 6px}
.box p{margin:0 0 8px;font-size:14.5px;color:var(--ink2)}
.box input[type=range]{width:100%;accent-color:var(--accent)}
.labrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.meter{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.meter strong{font:700 30px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{text-align:start;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{color:var(--ink2);font-weight:500}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--tile);border:1px solid var(--edge);margin:4px 0 12px}
.seg button{flex:1;height:34px;border-radius:99px;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--ink);font-weight:600}
.steps{display:flex;gap:6px;margin:6px 0 14px;direction:rtl}
.steps button{flex:1;height:30px;border-radius:9px;font:600 13px system-ui,sans-serif;background:var(--tile);border:1px solid var(--edge);color:var(--ink2)}
.steps button.done{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink)}
.steps button[aria-current=step]{background:var(--accent);color:#fff;border-color:transparent}
.stepcard{border-radius:18px;background:var(--tile);border:1px solid var(--edge);padding:16px;min-height:150px}
.stepcard small{color:var(--accent);font-weight:600;font-size:13px}
.stepcard p{margin:6px 0 0;font-size:16.5px;line-height:1.75}
.stepnav{display:flex;justify-content:space-between;margin-top:12px}
.btn{height:38px;padding:0 16px;border-radius:99px;background:var(--raised);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.q{padding:14px 2px;border-bottom:1px solid var(--line)}
.q p{margin:0 0 8px;font-weight:600;font-size:16px}
.q .opts{display:grid;gap:6px}
.q .opts button{text-align:start;padding:9px 12px;border-radius:12px;background:var(--tile);border:1px solid var(--edge);font-size:14.5px}
.q .opts button:hover:not(:disabled){border-color:var(--accent)}
.q .opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.q .opts button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.q .why{font-size:13.5px;color:var(--ink2);margin-top:8px}
.score{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 4px;font-weight:600}

@media (max-width:1200px){
  header{padding:18px 24px}
  nav{gap:20px}
  .search{width:200px}
  .app{grid-template-columns:220px minmax(0,1fr);padding:6px 24px 24px}
  .panel{grid-column:1/-1;position:static;max-height:none}
  .pane{overflow:visible}
}
@media (max-width:820px){
  header{grid-template-columns:1fr auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
  nav{display:none}
  .brand{font-size:18px;gap:10px}
  .search{width:150px}
  .results{width:min(300px,calc(100vw - 32px))}
  .app{grid-template-columns:minmax(0,1fr);padding:0 16px 20px;gap:16px}
  .side{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;gap:10px}
  .card{flex:0 0 230px;grid-template-columns:56px 1fr 12px;scroll-snap-align:start;padding:10px}
  .card img{width:56px;height:60px}
  .count,.tagline{display:none}
  .stage{min-height:0;height:min(74svh,540px)}
  #gl{inset:0 -16px 70px}
  .hint{display:none}
  .call{font-size:13px;padding:4px 9px}
  .bar{gap:5px;padding:5px;max-width:calc(100vw - 24px)}
  .bar>*{height:40px}
  .bar .ic{width:40px}
  .zoom{padding:0 10px;gap:8px}
  .zoom input{width:56px}
  .mode button{padding:0 11px;height:32px}
  .panel{padding:22px 16px 14px;border-radius:22px}
  .tabs button{font-size:13px}
  .st>button{grid-template-columns:58px 1fr 22px}
  .st img,.st .ph{width:58px;height:54px}
  .st .more{padding-right:16px}
}
</style>

<div dir="rtl" lang="ar" id="root">
<header>
  <div class="brand"><i aria-hidden="true"></i><span>الأوليات<small>تنوع الطلائعيات · 4-2</small></span></div>

<main class="app" id="top">

      <div class="zoom"><button id="zout" aria-label="تصغير">−</button><input id="zr" type="range" min="0" max="100" value="30" aria-label="التكبير"><button id="zin" aria-label="تكبير">+</button></div>

function buildParamecium() {

function buildAmoeba() {

function buildPlasmodium() {
  const g = new THREE.Group(), A = {}, body = new THREE.Group(); g.add(body);

function buildTrypanosoma() {

/* snapshots for cards and structure close-ups */
const tr = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
tr.toneMapping = THREE.ACESFilmicToneMapping; tr.toneMappingExposure = 1.05;
const ts = new THREE.Scene(), tc = new THREE.PerspectiveCamera(30, 1, .01, 100);
ts.environment = new THREE.PMREMGenerator(tr).fromScene(new RoomEnvironment(), .04).texture; ts.environmentIntensity = .95;
ts.add(new THREE.HemisphereLight('#ffffff', '#e9dccb', .8)); const tk = key.clone(); tk.castShadow = false; ts.add(tk);
const shots = {};
function shoot(w, h, pos, look) { tr.setSize(w, h); tc.aspect = w / h; tc.updateProjectionMatrix(); tc.position.copy(pos); tc.lookAt(look); tr.render(ts, tc); return tr.domElement.toDataURL('image/webp', .9); }
function snaps(c, h) {

  const r = h.userData.radius, s = shots[c.key] = {}, inner = h.userData.inner, A = h.userData.model.A;
  s.card = shoot(144, 160, VIEW_DIR.clone().multiplyScalar(r * 2.4), V());
  for (const st of c.structs) { const a = st[5] && A[st[5]]; if (!a) continue;
    const p = a.clone().applyMatrix4(inner.matrixWorld), out = p.clone().normalize().add(VIEW_DIR).normalize();
    s[st[0]] = shoot(144, 132, p.clone().addScaledVector(out, r * .6), p); }
  ts.remove(h); h.rotation.y = rot; if (parent) parent.add(h);
}

/* ===================== UI ===================== */
const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>';
$('list').innerHTML = CELLS.map(c => `<button class="card glass" data-k="${c.key}" aria-pressed="false" style="--accent:${c.accent}"><img alt="" width="72" height="80"><span><b>${c.name}</b><small>${c.ex} · ${c.tag}</small><em>${c.latin.split(' · ')[0]}</em></span>${chev}</button>`).join('');
let current = null, want = null;
const TABS = ['structures', 'functions', 'seq', 'quiz'];
function tab(name) { TABS.forEach(t => { $('t-' + t).setAttribute('aria-selected', t === name); $('p-' + t).hidden = t !== name; }); }
TABS.forEach(t => $('t-' + t).onclick = () => tab(t));
document.querySelectorAll('nav a[data-tab]').forEach(a => a.onclick = () => tab(a.dataset.tab));

function renderStructs(c) {

  $('p-structures').querySelectorAll('.st').forEach(el => {

}

function extraHTML(c) {
  if (c.extra === 'lab') return `<div class="box"><h2>مختبر: تركيز المحلول والفجوة المنقبضة</h2><p>حرّك المؤشر لتغيير تركيز الأملاح حول البراميسيوم، وراقب سرعة ضخ الفجوة المنقبضة في النموذج.</p>
    <input type="range" id="conc" min="0" max="100" value="12" aria-label="تركيز المحلول الخارجي"><div class="labrow"><span>ماء عذب (منخفض التركيز)</span><span>محلول أكثر تركيزًا</span></div>

  if (c.extra === 'malaria') return `<div class="box"><h2>أعراض الملاريا</h2><div class="chips" style="margin:6px 0 8px"><span>ارتفاع الحرارة</span><span>البرد</span><span>الصداع</span><span>القشعريرة</span><span>أعراض تشبه الإنفلونزا</span></div><p>للمزيد عن الملاريا: <a class="linkbtn" href="https://www.moh.gov.sa" target="_blank" rel="noopener">وزارة الصحة السعودية ↗</a></p></div>`;
  if (c.extra === 'sleep') return `<div class="box"><h2>مقارنة مرضي النوم</h2><table class="cmp"><tr><th></th><th>الأمريكي (شاجاز)</th><th>الأفريقي</th></tr><tr><th>الناقل</th><td>حشرة ردوفيد (البق)</td><td>ذبابة تسي تسي</td></tr><tr><th>طريقة العدوى</th><td>براز البق عبر الجروح أو الأغشية المخاطية</td><td>لسعة الذبابة من غددها اللعابية</td></tr><tr><th>الأضرار</th><td>القلب والكبد والطحال</td><td>حمى، التهاب العقد الليمفاوية، الجهاز العصبي</td></tr><tr><th>الانتشار</th><td>وسط وجنوب أمريكا</td><td>أفريقيا (الشرقي والغربي)</td></tr></table></div>`;
  return '';
}
function bindLab(c) {
  const el = $('conc'); if (!el) return;
  const upd = () => { const v = +el.value, per = 1.3 + v / 100 * 6.7; const m = models[c.key]; if (m) m.userData.model.st.period = per;
    $('rate').textContent = Math.round(60 / per);
    $('labWhy').textContent = v < 35 ? 'التركيز خارج الخلية أقل منه داخلها، فيدخل الماء بسرعة بالخاصية الأسموزية، وتضخ الفجوة بسرعة لتحافظ على الاتزان.' : v < 70 ? 'يقل الفرق في التركيز، فيبطؤ دخول الماء ويقل نشاط الفجوة.' : 'التركيز الخارجي مرتفع، فيدخل القليل من الماء وتكاد الفجوة تتوقف. هذا ما يفسر المنحنى الهابط للبراميسيوم الذي نُقل إلى محلول أكثر تركيزًا.'; };
  el.oninput = upd; upd();
}

function renderSeq(c) {
  let set = 0, step = 0;
  const draw = () => {
    const S = c.seq[set], n = S.steps.length, [txt, ak] = S.steps[step];
    $('p-seq').innerHTML = (c.seq.length > 1 ? `<div class="seg" role="group">${c.seq.map((s, i) => `<button data-set="${i}" aria-pressed="${i === set}">${s.title}</button>`).join('')}</div>` : `<p class="know" style="margin-top:4px">${S.title}</p>`) +
      `<div class="steps" role="list">${S.steps.map((_, i) => `<button role="listitem" data-step="${i}" class="${i < step ? 'done' : ''}" ${i === step ? 'aria-current="step"' : ''} aria-label="الخطوة ${i + 1}">${i + 1}</button>`).join('')}</div>
      <div class="stepcard"><small>الخطوة ${step + 1} من ${n}</small><p>${txt}</p>${ak ? `<p style="font-size:14px;margin-top:10px"><a role="button" tabindex="0" class="linkbtn" data-show>أظهر «${ak}» على النموذج</a></p>` : ''}</div>
      <div class="stepnav"><button class="btn" id="sPrev" ${step === 0 ? 'disabled' : ''}>→ السابقة</button><button class="btn pri" id="sNext" ${step === n - 1 ? 'disabled' : ''}>التالية ←</button></div>`;
    $('p-seq').querySelectorAll('[data-set]').forEach(b => b.onclick = () => { set = +b.dataset.set; step = 0; draw(); });
    $('p-seq').querySelectorAll('[data-step]').forEach(b => b.onclick = () => { step = +b.dataset.step; draw(); });
    $('sPrev').onclick = () => { step--; draw(); }; $('sNext').onclick = () => { step++; draw(); };
    const sh = $('p-seq').querySelector('[data-show]'); if (sh) sh.onclick = sh.onkeydown = e => { if (e.type === 'keydown' && e.key !== 'Enter') return; focusOn(ak); };
  };
  $('t-seq').textContent = c.key === 'cilio' ? 'الاقتران' : c.key === 'sarco' ? 'التغذي' : c.key === 'apico' ? 'دورة الحياة' : 'العدوى';
  draw();
}
function renderQuiz(c) {
  const ans = [];
  $('p-quiz').innerHTML = c.quiz.map(([q, opts], i) => `<div class="q" data-q="${i}"><p>${i + 1}. ${q}</p><div class="opts">${opts.map((o, j) => `<button data-o="${j}">${o}</button>`).join('')}</div><div class="why" hidden></div></div>`).join('') + `<div class="score"><span id="score">أجب عن الأسئلة الثلاثة</span><button class="btn" id="qReset">أعد المحاولة</button></div>`;
  $('p-quiz').querySelectorAll('.q').forEach(el => { const i = +el.dataset.q, [, , right, why] = c.quiz[i];
    el.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { const j = +b.dataset.o; ans[i] = j === right;
      el.querySelectorAll('[data-o]').forEach(x => { x.disabled = true; if (+x.dataset.o === right) x.classList.add('ok'); else if (x === b) x.classList.add('no'); });
      const w = el.querySelector('.why'); w.hidden = false; w.textContent = (j === right ? 'إجابة صحيحة. ' : 'ليست هذه. ') + why;
      const done = ans.filter(x => x !== undefined).length, ok = ans.filter(Boolean).length;
      $('score').textContent = done === c.quiz.length ? `نتيجتك: ${ok} من ${c.quiz.length}` : `أجبت عن ${done} من ${c.quiz.length}`;
      // إشعار منصة لبيبة عند إكمال أول اختبار (مرة واحدة)
      if (done === c.quiz.length && !window.__labeebaDone) { window.__labeebaDone = true; try { parent.postMessage({ type: 'labeeba-lab-complete', score: Math.round(ok / c.quiz.length * 100), tasks: c.quiz.length }, '*'); } catch (e) {} } }); });
  $('qReset').onclick = () => renderQuiz(c);
}

function select(k) {
  const c = CELLS.find(x => x.key === k), i = CELLS.indexOf(c); want = c;
  document.documentElement.style.setProperty('--accent', c.accent);
  document.querySelectorAll('.card').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  $('kName').textContent = 'شعبة ' + c.name; $('kNum').textContent = `0${i + 1} / 0${CELLS.length}`; $('title').textContent = c.name; $('latin').textContent = c.latin; $('lede').textContent = c.lede;
  $('kv').innerHTML = c.kv.map(([a, b], j) => `<div class="${j === 3 && b.length > 22 ? 'wide' : ''}"><dt>${a}</dt><dd>${b}</dd></div>`).join('');
  if (!models[k]) { models[k] = make(c); snaps(c, models[k]); }
  renderStructs(c);
  $('p-functions').innerHTML = c.fns.map(([a, b]) => `<div class="fn"><b>${a}</b><span>${b}</span></div>`).join('') + `<p class="know">${c.know}</p><div class="chips">${c.chips.map(x => `<span>${x}</span>`).join('')}</div>` + extraHTML(c) + `<p class="note">النماذج رسوم تعليمية مبسطة، وليست بمقياس رسم حقيقي.</p>`;

  const h = models[k];
  if (current) scene.remove(current);
  current = h; h.rotation.y = 0; scene.add(h); ground.position.y = h.userData.minY - .03;

}
document.querySelectorAll('.card').forEach(b => b.onclick = () => select(b.dataset.k));

/* callouts */
let calls = [];
function openStruct(n) { tab('structures'); const el = [...document.querySelectorAll('.st')].find(e => e.querySelector('b').firstChild.textContent === n); if (el && !el.classList.contains('open')) el.querySelector('button').click(); el?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
function buildCallouts(c) {
  $('calls').innerHTML = ''; calls = [];
  const A = current.userData.model.A;
  c.structs.filter(s => s[4] && s[5] && A[s[5]]).forEach(([n, , , , , ak]) => {
    const lead = Object.assign(document.createElement('span'), { className: 'lead off' });
    const dot = Object.assign(document.createElement('span'), { className: 'dot off' });
    const lab = Object.assign(document.createElement('button'), { className: 'call off', textContent: n });
    lab.onclick = () => openStruct(n);
    $('calls').append(lead, dot, lab); calls.push({ a: A[ak], lead, dot, lab });
  });
}
const tmp = V(), ctr = V(), camDir = V();
function placeCallouts() {
  if (!current) return;
  const w = gl.clientWidth, h = gl.clientHeight, ox = gl.offsetLeft, oy = gl.offsetTop, sw = stageEl.clientWidth, inner = current.userData.inner;
  ctr.copy(controls.target).project(camera); const cx = (ctr.x + 1) / 2 * w + ox, cy = (1 - ctr.y) / 2 * h + oy;
  camDir.copy(camera.position).sub(controls.target).normalize();
  const placed = [];
  calls.forEach(k => {
    tmp.copy(k.a).applyMatrix4(inner.matrixWorld);
    const facing = tmp.clone().sub(controls.target).normalize().dot(camDir) > -.25;
    tmp.project(camera);
    const x = (tmp.x + 1) / 2 * w + ox, y = (1 - tmp.y) / 2 * h + oy;
    let dx = x - cx, dy = y - cy; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    const rPx = current.userData.radius / (camera.position.distanceTo(controls.target) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * h * .5;
    const reach = Math.max(36, rPx * .9 - len + (w < 600 ? 16 : 36));
    const lw = k.lab.offsetWidth;
    let lx = x + dx * reach, ly = Math.min(Math.max(y + dy * reach * .8, 24), stageEl.clientHeight - 100);
    lx = Math.min(Math.max(lx, dx < 0 ? lw + 8 : 8), sw - (dx < 0 ? 8 : lw + 8));
    const left = dx < 0 ? lx - lw : lx, lh = k.lab.offsetHeight + 6;
    for (const p of placed) if (left < p.r && left + lw > p.l && Math.abs(ly - p.y) < lh) ly = p.y + (ly >= p.y ? lh : -lh);
    placed.push({ l: left, r: left + lw, y: ly });
    k.lab.style.transform = `translate(${left}px,${ly - 13}px)`;
    const ex = dx < 0 ? lx + 4 : lx - 4, ey = ly, L = Math.hypot(x - ex, y - ey), ang = Math.atan2(y - ey, x - ex);
    k.lead.style.width = L + 'px'; k.lead.style.transform = `translate(${ex}px,${ey}px) rotate(${ang}rad)`;
    k.dot.style.transform = `translate(${x}px,${y}px)`;
    [k.lab, k.lead, k.dot].forEach(e => e.classList.toggle('off', !facing));
  });
}

/* view controls */
function homeDist() { const r = current?.userData.radius || 2; return r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * .8 * Math.max(1, .95 / camera.aspect); }
let dMin = 2, dMax = 20;
function resetView() { const d = homeDist(); dMin = d * .35; dMax = d * 1.8; controls.target.set(0, 0, 0); camera.position.copy(flat ? V(0, 1, .0001) : VIEW_DIR).multiplyScalar(d); controls.update(); syncSlider(); }
function setDist(d) { d = THREE.MathUtils.clamp(d, dMin, dMax); const v = camera.position.clone().sub(controls.target).setLength(d); camera.position.copy(controls.target).add(v); syncSlider(); }
const sliderToDist = v => dMax * Math.pow(dMin / dMax, v / 100);
function syncSlider() { const d = camera.position.distanceTo(controls.target); $('zr').value = Math.round(Math.log(d / dMax) / Math.log(dMin / dMax) * 100); }
$('zr').oninput = e => setDist(sliderToDist(+e.target.value));
$('zin').onclick = () => setDist(camera.position.distanceTo(controls.target) * .85);
$('zout').onclick = () => setDist(camera.position.distanceTo(controls.target) * 1.18);
$('recenter').onclick = () => { if (current) current.rotation.y = 0; resetView(); };
function setMode(f) { flat = f; $('m3').setAttribute('aria-pressed', !f); $('m2').setAttribute('aria-pressed', f); camera.fov = f ? 12 : 38; camera.updateProjectionMatrix(); controls.enableRotate = !f; if (current) current.rotation.y = 0; resetView(); }
$('m3').onclick = () => setMode(false); $('m2').onclick = () => setMode(true);
$('fs').onclick = () => { try { const p = document.fullscreenElement ? document.exitFullscreen() : stageEl.requestFullscreen?.(); p?.catch?.(() => {}); } catch {} };
const playIco = { pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="6" width="3.2" height="12" rx="1"/><rect x="13.8" y="6" width="3.2" height="12" rx="1"/></svg>', play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg>' };
function syncPlay() { $('play').innerHTML = anim ? playIco.pause : playIco.play; $('play').setAttribute('aria-label', anim ? 'إيقاف الحركة' : 'تشغيل الحركة'); $('play').title = $('play').getAttribute('aria-label'); }
$('play').onclick = () => { anim = !anim; spin = anim; syncPlay(); }; syncPlay();
function focusOn(ak) {
  const A = current?.userData.model.A, a = A?.[ak]; if (!a) return;
  if (flat) setMode(false); spin = false;
  const p = a.clone().applyMatrix4(current.userData.inner.matrixWorld), out = p.clone().normalize().add(VIEW_DIR).normalize();
  controls.target.copy(p).multiplyScalar(.6); camera.position.copy(p).addScaledVector(out, homeDist() * .5); controls.update(); syncSlider();
  if (innerWidth < 1200) stageEl.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
}
renderer.domElement.addEventListener('pointerdown', () => { spin = false; });
renderer.domElement.addEventListener('wheel', e => {
  if (!current || e.ctrlKey) return;
  const d = camera.position.distanceTo(controls.target), next = THREE.MathUtils.clamp(d * Math.exp(e.deltaY * .0012), dMin, dMax);
  if (Math.abs(next - d) < 1e-3) return; e.preventDefault(); setDist(next);
}, { passive: false });

/* search */
const INDEX = CELLS.flatMap(c => [...c.structs.map(s => ({ c, kind: 'structures', n: s[0], d: s[1] + ' ' + s[2] })), ...c.fns.map(f => ({ c, kind: 'functions', n: f[0], d: f[1] }))]);
const norm = s => s.toLowerCase().replace(/[ًٌٍَُِّْ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
$('q').oninput = e => {
  const q = norm(e.target.value.trim()), box = $('results');
  const hits = q ? INDEX.filter(x => norm(x.n + ' ' + x.d + ' ' + x.c.name + ' ' + x.c.ex).includes(q)).slice(0, 8) : [];
  box.innerHTML = hits.length ? hits.map((x, i) => `<button role="option" data-i="${i}">${x.n}<small>${x.c.name} · ${x.kind === 'structures' ? 'تركيب' : 'وظيفة'}</small></button>`).join('') : q ? '<button disabled>لا توجد نتائج</button>' : '';
  box.hidden = !q;
  box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
    const x = hits[b.dataset.i]; box.hidden = true; e.target.value = '';
    select(x.c.key); tab(x.kind); if (x.kind === 'structures') openStruct(x.n);
  });
};
$('q').onkeydown = e => { if (e.key === 'Escape') { e.target.value = ''; $('results').hidden = true; } };
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) $('results').hidden = true; });

/* loop */
function size() { const w = gl.clientWidth, h = gl.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); if (current) resetView(); }
new ResizeObserver(size).observe(gl); size();
let visible = true, last = performance.now();
new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(gl);
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!visible || !current) return;
  if (anim) { clock += dt; current.userData.model.update(clock); }
  if (spin && !flat) current.rotation.y += dt * .14;
  controls.update(); renderer.render(scene, camera); placeCallouts();
});

// render all card thumbnails up front, then open the first phylum
CELLS.forEach(c => { if (!models[c.key]) { models[c.key] = make(c); snaps(c, models[c.key]); } const img = document.querySelector(`.card[data-k="${c.key}"] img`); if (img) img.src = shots[c.key].card; });
select('cilio');
</script>
